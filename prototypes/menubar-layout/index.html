<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WatchLogs — Menubar layout prototype (range selector + History / By Service / Settings)</title>
<!--
  PROTOTYPE — throwaway. Answers wayfinder ticket #7 on map #1.
  Plan: three structurally different menubar-popover layouts on one page,
  switchable via ?variant=A|B|C and a floating bottom bar. Mock data only,
  no build, no server. Double-click this file.

  What the three variants disagree about:
    A  Compact tabbed     — 360x520, fixed. One pane at a time behind a tab row.
    B  Single scroll      — 420x600, RESIZABLE. Everything in one scroll;
                            Settings is a slide-over. Drag the corner handle.
    C  Master / detail    — 560x640, fixed, window-like. Left nav rail + big pane.
-->
<style>
  :root {
    --wall-1: #2b3350;
    --wall-2: #6d5f8c;
    --wall-3: #c98d9b;
    --ink: #1d1f24;
    --ink-dim: #6b7280;
    --ink-faint: #9aa1ad;
    --panel: #f7f8fa;
    --panel-2: #eef0f4;
    --card: #ffffff;
    --line: #e2e5ea;
    --line-2: #d3d7de;
    --accent: #3b6ef5;
    --accent-soft: #e8effe;
    --yt: #ff0033;
    --nflx: #e50914;
    --twitch: #9146ff;
    --good: #128a5b;
    --good-soft: #e2f4ec;
    --warn: #a8630b;
    --warn-soft: #fbeedd;
    --prov: #7a4fd0;
    --prov-soft: #efe8fb;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 13px/1.5 var(--sans);
    color: var(--ink);
    background: linear-gradient(150deg, var(--wall-1), var(--wall-2) 55%, var(--wall-3));
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- faux macOS menubar + desktop shell -------------------------------- */
  .menubar {
    position: fixed; inset: 0 0 auto 0; height: 26px; z-index: 50;
    background: rgba(255,255,255,.62);
    backdrop-filter: saturate(180%) blur(18px);
    -webkit-backdrop-filter: saturate(180%) blur(18px);
    display: flex; align-items: center; gap: 16px;
    padding: 0 12px; font-size: 12px; color: #1d1f24;
    border-bottom: 1px solid rgba(0,0,0,.08);
  }
  .menubar .mb-left { font-weight: 600; }
  .menubar .mb-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .menubar .mb-eye {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 7px; border-radius: 6px; background: rgba(59,110,245,.16);
    font-weight: 600; color: #23408c;
  }
  .menubar .mb-eye::before { content: "◉"; font-size: 11px; }

  .desk {
    min-height: 100%;
    padding: 26px 0 120px;
    display: flex; justify-content: flex-end;
  }
  .anchor { position: relative; margin: 8px 46px 0 0; }
  .beak {
    position: absolute; top: -7px; right: 26px; width: 14px; height: 14px;
    background: var(--card); transform: rotate(45deg);
    border-left: 1px solid rgba(0,0,0,.06); border-top: 1px solid rgba(0,0,0,.06);
    z-index: 2;
  }

  /* ---- the popover box -------------------------------------------------- */
  .popover {
    position: relative; z-index: 1;
    background: var(--card);
    border-radius: 12px;
    box-shadow: 0 18px 60px rgba(10,12,30,.42), 0 2px 8px rgba(10,12,30,.28);
    overflow: hidden;
    display: flex; flex-direction: column;
    color: var(--ink);
  }
  .variant-A .popover { width: 360px; height: 520px; }
  .variant-B .popover { width: 420px; height: 600px; }
  .variant-C .popover { width: 560px; height: 640px; }

  /* size / state readout that hangs off the popover (not part of the design) */
  .readout {
    position: absolute; left: 0; right: 0; bottom: -30px;
    font: 11px/1.4 var(--mono); color: rgba(255,255,255,.85);
    text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,.5);
  }

  /* ---- shared bits ---------------------------------------------------- */
  .hd { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
  .app-name { font-weight: 700; font-size: 13px; letter-spacing: .01em; }
  .app-name .dot { color: var(--accent); }

  .seg { display: inline-flex; background: var(--panel-2); border-radius: 8px; padding: 2px; gap: 2px; }
  .seg button {
    font: 12px var(--sans); border: 0; background: transparent; color: var(--ink-dim);
    padding: 4px 9px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }

  .range-line { margin-top: 7px; font-size: 11.5px; color: var(--ink-dim); display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .range-line .res { font-family: var(--mono); color: var(--ink); }
  .range-line .sub { color: var(--ink-faint); }
  .spinner {
    width: 11px; height: 11px; border-radius: 50%;
    border: 2px solid var(--line-2); border-top-color: var(--accent);
    display: inline-block; animation: spin .7s linear infinite; vertical-align: -1px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .icon-btn {
    border: 1px solid var(--line-2); background: var(--card); color: var(--ink-dim);
    width: 26px; height: 26px; border-radius: 7px; cursor: pointer; font-size: 13px;
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--ink-faint); }

  .body { flex: 1; overflow: auto; }
  .body::-webkit-scrollbar { width: 9px; }
  .body::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 9px; border: 2px solid var(--card); }

  .foot {
    border-top: 1px solid var(--line); padding: 6px 12px;
    font: 10.5px/1.4 var(--mono); color: var(--ink-faint);
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .foot .off { text-decoration: line-through; }

  /* ---- History ------------------------------------------------------- */
  .day { border-bottom: 1px solid var(--line); }
  .day-hd {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 9px 14px; background: transparent; border: 0; cursor: pointer;
    font: inherit; text-align: left; color: var(--ink);
  }
  .day-hd:hover { background: var(--panel); }
  .day-hd .chev { color: var(--ink-faint); font-size: 10px; width: 10px; transition: transform .12s; }
  .day-hd.collapsed .chev { transform: rotate(-90deg); }
  .day-hd .d-name { font-weight: 650; }
  .day-hd .d-date { color: var(--ink-faint); font-size: 11.5px; }
  .day-hd .d-total { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); }
  .day-hd .d-span { display: block; font-size: 10.5px; color: var(--ink-faint); font-family: var(--mono); margin-top: 1px; }
  .prov-pill {
    font: 10px var(--sans); font-weight: 600; color: var(--prov);
    background: var(--prov-soft); border-radius: 999px; padding: 1px 7px;
  }
  .day-hd .d-total.prov { color: var(--prov); font-style: italic; }

  .views { padding: 2px 0 6px; }
  .view {
    display: grid; grid-template-columns: 14px 1fr auto; gap: 9px;
    padding: 6px 14px 6px 14px; align-items: start;
  }
  .view:hover { background: var(--panel); }
  .view .svc-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; }
  .view .v-main { min-width: 0; }
  .view .v-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 550; }
  .view .v-meta { font-size: 11px; color: var(--ink-dim); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 1px; }
  .tag {
    font: 10px var(--mono); padding: 0 5px; border-radius: 4px;
    background: var(--panel-2); color: var(--ink-dim);
  }
  .tag.fmt { background: #e9eefb; color: #2c4c9c; }
  .tag.emb { background: var(--warn-soft); color: var(--warn); }
  .tag.live { background: #fde8ec; color: var(--yt); }
  .view .v-time { font-family: var(--mono); font-size: 11.5px; color: var(--ink); text-align: right; white-space: nowrap; }
  .pos {
    grid-column: 2 / 4; height: 3px; border-radius: 3px; background: var(--panel-2);
    margin-top: 5px; overflow: hidden;
  }
  .pos > i { display: block; height: 100%; background: var(--line-2); }
  .more-row { padding: 8px 14px; font-size: 11.5px; color: var(--ink-faint); font-style: italic; }

  /* ---- By Service --------------------------------------------------- */
  .svc-scope { padding: 10px 14px 4px; font-size: 11.5px; color: var(--ink-dim); }
  .svc-scope b { color: var(--ink); font-weight: 600; }
  .svc {
    padding: 9px 14px; border-bottom: 1px solid var(--line);
  }
  .svc-top { display: flex; align-items: center; gap: 8px; }
  .svc-top .exp {
    border: 0; background: transparent; cursor: pointer; color: var(--ink-faint);
    font-size: 10px; width: 12px; padding: 0;
  }
  .svc-top .exp.spacer { visibility: hidden; }
  .svc-top .s-name { font-weight: 600; }
  .svc-top .s-name .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }
  .svc-top .s-total { margin-left: auto; font-family: var(--mono); font-size: 12px; }
  .svc .bar { height: 6px; border-radius: 4px; background: var(--panel-2); margin-top: 7px; overflow: hidden; }
  .svc .bar > i { display: block; height: 100%; background: var(--accent); opacity: .85; }
  .svc-kids { margin: 8px 0 2px; padding-left: 20px; display: grid; gap: 4px; }
  .svc-kids .k { display: flex; font-size: 11.5px; color: var(--ink-dim); }
  .svc-kids .k .kt { font-family: var(--mono); }
  .svc-kids .k .kn { margin-left: auto; font-family: var(--mono); color: var(--ink); }
  .svc-kids .emb-sub {
    font-size: 11px; color: var(--warn); border-top: 1px dashed var(--line-2);
    padding-top: 4px; margin-top: 2px;
  }
  .generic-note { font-size: 10.5px; color: var(--ink-faint); margin-top: 3px; }

  .adapter-group { background: var(--panel); }
  .adapter-hd {
    display: flex; align-items: center; gap: 7px; padding: 9px 14px 4px;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--warn);
  }
  .adapter-hd::before { content: "⚠"; }
  .adapter-sub { padding: 0 14px 6px; font-size: 11px; color: var(--ink-dim); }

  /* ---- Settings --------------------------------------------------- */
  .set { padding: 12px 14px; display: grid; gap: 14px; }
  .field { display: grid; gap: 4px; }
  .field label { font-weight: 600; font-size: 12px; }
  .field .hint { font-size: 11px; color: var(--ink-faint); }
  .field .ctl { display: flex; gap: 6px; align-items: center; }
  .field input[type=text], .field input[type=number] {
    font: 12px var(--mono); padding: 5px 8px; border: 1px solid var(--line-2);
    border-radius: 7px; background: var(--card); color: var(--ink); width: 100%;
  }
  .field input[readonly] { background: var(--panel-2); color: var(--ink-dim); }
  .field .mini {
    font: 11px var(--sans); padding: 4px 8px; border: 1px solid var(--line-2);
    border-radius: 6px; background: var(--card); cursor: pointer; white-space: nowrap;
  }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .switch .track { width: 34px; height: 20px; border-radius: 999px; background: var(--line-2); position: relative; transition: background .12s; }
  .switch .track > i { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .12s; }
  .switch.on .track { background: var(--good); }
  .switch.on .track > i { left: 16px; }
  .step-row { display: inline-flex; align-items: center; gap: 0; border: 1px solid var(--line-2); border-radius: 7px; overflow: hidden; }
  .step-row button { border: 0; background: var(--card); padding: 5px 10px; cursor: pointer; font: 13px var(--mono); }
  .step-row .val { padding: 5px 12px; font: 12px var(--mono); border-left: 1px solid var(--line-2); border-right: 1px solid var(--line-2); }

  /* ---- Categorical reserved slot -------------------------------- */
  .cat-stub {
    margin: 12px 14px; padding: 16px; border: 1.5px dashed var(--line-2);
    border-radius: 10px; text-align: center; color: var(--ink-faint);
  }
  .cat-stub .soon { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--accent); }

  /* ---- month grid (shared widget) ----------------------------- */
  .cal {
    position: absolute; z-index: 20; background: var(--card); border: 1px solid var(--line-2);
    border-radius: 10px; box-shadow: 0 10px 30px rgba(10,12,30,.28); padding: 10px;
    width: 232px;
  }
  .cal-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .cal-hd .m { font-weight: 650; font-size: 12px; }
  .cal-hd button { border: 0; background: transparent; cursor: pointer; color: var(--ink-dim); font-size: 13px; padding: 2px 6px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-grid .dow { font-size: 9.5px; color: var(--ink-faint); text-align: center; padding: 2px 0; text-transform: uppercase; }
  .cal-grid .cell {
    font: 11px var(--mono); text-align: center; padding: 5px 0; border-radius: 5px;
    cursor: pointer; color: var(--ink); user-select: none;
  }
  .cal-grid .cell.mut { color: var(--ink-faint); }
  .cal-grid .cell:hover { background: var(--panel-2); }
  .cal-grid .cell.in { background: var(--accent-soft); border-radius: 0; }
  .cal-grid .cell.end { background: var(--accent); color: #fff; }
  .cal-foot { margin-top: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--ink-dim); }
  .cal-foot button { font: 11px var(--sans); border: 1px solid var(--line-2); background: var(--card); border-radius: 6px; padding: 3px 10px; cursor: pointer; }

  /* ================= VARIANT A — compact tabbed ================= */
  .variant-A .a-tabs { display: flex; gap: 4px; padding: 8px 14px 0; }
  .variant-A .a-tabs .seg { flex: 1; }
  .variant-A .a-tabs .seg button { flex: 1; text-align: center; }
  .variant-A .a-tabs .gear { margin-left: 6px; }
  .variant-A .a-tabs .seg button:disabled { color: var(--ink-faint); cursor: default; }
  .variant-A .a-tabs .seg button:disabled .soon { font-size: 8px; display: block; letter-spacing: .06em; }

  /* ================= VARIANT B — single scroll ================= */
  .variant-B .b-hd { position: sticky; top: 0; z-index: 10; background: var(--card); }
  .variant-B .b-hd .row1 { display: flex; align-items: center; gap: 8px; padding: 12px 14px 0; }
  .variant-B .b-hd .row1 .app-name { margin-right: auto; }
  .variant-B .b-section-hd {
    padding: 12px 14px 6px; font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .07em; color: var(--ink-faint); background: var(--panel);
    border-bottom: 1px solid var(--line); position: sticky; top: 84px; z-index: 5;
  }
  .variant-B .slideover {
    position: absolute; inset: 0; background: var(--card); z-index: 30;
    display: flex; flex-direction: column;
    transform: translateX(100%); transition: transform .18s ease;
  }
  .variant-B .slideover.open { transform: translateX(0); }
  .variant-B .slideover .so-hd { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 700; }
  .variant-B .slideover .so-hd button { border: 0; background: transparent; font-size: 15px; cursor: pointer; color: var(--ink-dim); }
  .variant-B .resize-h {
    position: absolute; right: 2px; bottom: 2px; width: 16px; height: 16px;
    cursor: nwse-resize; z-index: 40;
    background: linear-gradient(135deg, transparent 46%, var(--line-2) 46%, var(--line-2) 54%, transparent 54%, transparent 66%, var(--line-2) 66%, var(--line-2) 74%, transparent 74%);
  }

  /* ================= VARIANT C — master / detail ================= */
  .variant-C .c-wrap { display: grid; grid-template-columns: 156px 1fr; flex: 1; min-height: 0; }
  .variant-C .rail {
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 12px 10px; gap: 4px;
  }
  .variant-C .rail .app-name { padding: 0 6px 6px; }
  .variant-C .rail .range-btn {
    text-align: left; font: 12px var(--sans); border: 1px solid var(--line-2);
    background: var(--card); border-radius: 8px; padding: 7px 9px; cursor: pointer;
    margin-bottom: 8px; position: relative;
  }
  .variant-C .rail .range-btn .rb-label { font-weight: 600; }
  .variant-C .rail .range-btn .rb-res { display: block; font: 10px var(--mono); color: var(--ink-dim); margin-top: 2px; }
  .variant-C .rail nav { display: grid; gap: 2px; }
  .variant-C .rail nav button {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    border: 0; background: transparent; padding: 7px 9px; border-radius: 7px;
    font: 12.5px var(--sans); color: var(--ink-dim); cursor: pointer;
  }
  .variant-C .rail nav button .ic { width: 14px; text-align: center; }
  .variant-C .rail nav button.on { background: var(--accent-soft); color: #23408c; font-weight: 650; }
  .variant-C .rail nav button:disabled { color: var(--ink-faint); cursor: default; }
  .variant-C .rail nav button .lock { margin-left: auto; font-size: 10px; }
  .variant-C .rail .rail-foot { margin-top: auto; font: 10px var(--mono); color: var(--ink-faint); padding: 6px; }
  .variant-C .detail { display: flex; flex-direction: column; min-width: 0; }
  .variant-C .detail .d-hd { padding: 14px 16px 8px; border-bottom: 1px solid var(--line); }
  .variant-C .detail .d-hd h2 { margin: 0; font-size: 15px; }
  .variant-C .detail .d-hd .sub { font-size: 11.5px; color: var(--ink-dim); margin-top: 2px; }
  .variant-C .detail .d-body { flex: 1; overflow: auto; }
  .variant-C .chart-svc { padding: 12px 16px; display: grid; gap: 14px; }
  .variant-C .chart-svc .crow .clabel { display: flex; font-size: 12px; margin-bottom: 4px; }
  .variant-C .chart-svc .crow .clabel .cn { font-weight: 600; }
  .variant-C .chart-svc .crow .clabel .cv { margin-left: auto; font-family: var(--mono); }
  .variant-C .chart-svc .ctrack { height: 20px; background: var(--panel-2); border-radius: 5px; overflow: hidden; display: flex; }
  .variant-C .chart-svc .ctrack > i { height: 100%; display: block; }
  .variant-C .chart-svc .ckids { padding-left: 12px; margin-top: 8px; display: grid; gap: 8px; }
  .variant-C .chart-svc .ckids .ck .cktrack { height: 12px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
  .variant-C .chart-svc .ckids .ck .cktrack > i { display: block; height: 100%; background: var(--yt); opacity: .8; }
  .variant-C .chart-svc .ckids .ck .cklabel { display: flex; font-size: 11px; color: var(--ink-dim); margin-bottom: 3px; }
  .variant-C .chart-svc .ckids .ck .cklabel .v { margin-left: auto; font-family: var(--mono); }

  /* ---- floating variant switcher (NOT part of the design) ---- */
  #switcher {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    z-index: 999; display: flex; align-items: center; gap: 2px;
    background: #0f1220; color: #fff; border-radius: 999px; padding: 5px 6px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5); font: 12px var(--sans);
  }
  #switcher button {
    border: 0; background: transparent; color: #fff; cursor: pointer;
    font-size: 15px; width: 30px; height: 28px; border-radius: 999px;
  }
  #switcher button:hover { background: rgba(255,255,255,.14); }
  #switcher .label { padding: 0 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #switcher .label b { font-weight: 700; }
  #switcher .label span { opacity: .6; margin-left: 6px; }
  .hint-note {
    position: fixed; left: 50%; bottom: 4px; transform: translateX(-50%);
    z-index: 999; color: rgba(255,255,255,.7); font: 10px var(--mono); text-shadow: 0 1px 2px rgba(0,0,0,.5);
  }
</style>
</head>
<body>
<div class="menubar">
  <span class="mb-left">WatchLogs</span>
  <span class="mb-right">
    <span class="mb-eye">2h 05m</span>
    <span>Fri 29 Aug&nbsp;&nbsp;9:41 PM</span>
  </span>
</div>

<div class="desk">
  <div class="anchor">
    <div class="beak"></div>
    <div id="stage"></div>
    <div class="readout" id="readout"></div>
  </div>
</div>

<div id="switcher"></div>
<div class="hint-note">← / → to switch layouts &nbsp;·&nbsp; ?variant=A|B|C</div>

<script>
/* ============================================================================
   MOCK DATA  — nothing here is real; it exists to give the layouts real density
   ========================================================================== */

const RANGES = {
  today: { label: "Today",      sub: "open day · provisional", res: "Fri Aug 29 (so far)" },
  week:  { label: "This Week",  sub: "Mon–today · instant",    res: "Mon Aug 25 – Fri Aug 29" },
  month: { label: "This Month", sub: "1st–today · instant",    res: "Aug 1 – Aug 29" },
  custom:{ label: "Custom",     sub: "pick a range",           res: "—" },
};

const SVC_COLOR = { youtube: "var(--yt)", netflix: "var(--nflx)", twitch: "var(--twitch)", vimeo: "#17b3e8", mit: "#8a1a2b" };

// History: activity-flexed "days", newest first. `startsAt` is the day's start;
// a day may run past midnight and still be one group under its start date.
const HISTORY = [
  {
    id: "today", name: "Today", date: null, provisional: true,

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function rangeResolved() {
  if (state.range === "custom" && state.customStart && state.customEnd) {
    const f = (d) => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    return `${f(state.customStart)} – ${f(state.customEnd)}`;
  }
  return RANGES[state.range].res;
}

function visibleDays() {
  if (state.range === "today") return HISTORY.filter((d) => d.id === "today");

}

/* ---- shared: date-range segmented control ---- */
function rangeSeg(size) {
  const keys = ["today", "week", "month", "custom"];
  return `<div class="seg range-seg" data-size="${size}">${keys
    .map((k) => `<button data-range="${k}" class="${state.range === k ? "on" : ""}">${RANGES[k].label}</button>`)
    .join("")}</div>`;
}

function rangeLine() {
  const r = RANGES[state.range];
  const spin = state.computing ? `<span class="spinner"></span>` : "";
  return `<div class="range-line">${spin}<span class="res">${esc(rangeResolved())}</span><span class="sub">${esc(r.sub)}</span></div>`;
}

/* ---- shared: month grid ---- */
function monthGrid(anchorCss) {
  const first = new Date(state.calYear, state.calMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(state.calYear, state.calMonth + 1, 0).getDate();
  const monthName = first.toLocaleDateString("en-US", { month: "long", year: "numeric" });
  const dows = ["S", "M", "T", "W", "T", "F", "S"].map((d) => `<div class="dow">${d}</div>`).join("");

  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(`<div class="cell mut"></div>`);
  const s = state.customStart, e = state.customEnd;
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(state.calYear, state.calMonth, d);
    let cls = "cell";
    if (s && e && date >= s && date <= e) cls += " in";
    if ((s && +date === +s) || (e && +date === +e)) cls += " end";
    cells.push(`<div class="${cls}" data-day="${d}">${d}</div>`);
  }

  return `<div class="cal" style="${anchorCss}">
    <div class="cal-hd">
      <button data-cal="prev">‹</button>
      <span class="m">${monthName}</span>
      <button data-cal="next">›</button>
    </div>
    <div class="cal-grid">${dows}${cells.join("")}</div>
    <div class="cal-foot">
      <span>${s && e ? "click Apply" : s ? "pick end day" : "pick start day"}</span>
      <button data-cal="apply">Apply</button>
    </div>
  </div>`;
}

function render() {
  document.body.className = "variant-" + state.variant;
  const stage = $("#stage");
  stage.innerHTML = state.variant === "A" ? renderA() : state.variant === "B" ? renderB() : renderC();

  const size = state.variant === "A" ? "360 × 520 · fixed"
    : state.variant === "B" ? `${state.popW} × ${state.popH} · resizable`
    : "560 × 640 · fixed";
  $("#readout").textContent = `variant ${state.variant}  ·  ${size}  ·  range=${state.range}  ·  pane=${state.pane}`;

  renderSwitcher();
}

const VARIANT_NAMES = { A: "Compact tabbed", B: "Single scroll", C: "Master / detail" };
function renderSwitcher() {
  $("#switcher").innerHTML = `
    <button data-cycle="-1">‹</button>
    <span class="label"><b>${state.variant}</b><span>${VARIANT_NAMES[state.variant]}</span></span>
    <button data-cycle="1">›</button>`;
}

function setVariant(v) {
  state.variant = v;
  if (v === "B" && state.pane === "settings") state.pane = "history";
  const url = new URL(location.href);
  url.searchParams.set("variant", v);
  history.replaceState(null, "", url);
  render();
}

function cycle(dir) {
  const order = ["A", "B", "C"];
  const i = (order.indexOf(state.variant) + dir + 3) % 3;
  setVariant(order[i]);
}

function pickRange(k) {
  if (k === "custom") {
    state.range = "custom";
    state.calOpen = true;
    render();
    return;
  }
  state.range = k;
  state.calOpen = false;
  render();
}

function applyCustom() {
  state.calOpen = false;
  state.computing = true;
  render();
  setTimeout(() => { state.computing = false; render(); }, 450); // fake aggregation spinner
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-cycle],[data-range],[data-pane],[data-day-toggle],[data-svc-toggle],[data-cal],[data-cal-open],[data-so-open],[data-so-close],[data-toggle-login],[data-day]");
  if (!t) {
    // click outside the calendar closes it
    if (state.calOpen && !e.target.closest(".cal") && !e.target.closest(".range-seg") && !e.target.closest(".range-btn")) {
      state.calOpen = false; render();
    }
    return;
  }

  if (t.dataset.cycle) return cycle(+t.dataset.cycle);
  if (t.dataset.range) return pickRange(t.dataset.range);
  if (t.dataset.calOpen !== undefined) { state.calOpen = !state.calOpen; return render(); }

  if (t.dataset.pane) {
    state.pane = t.dataset.pane;
    return render();
  }
  if (t.dataset.dayToggle) {
    const id = t.dataset.dayToggle;
    state.collapsed[id] = !state.collapsed[id];
    return render();
  }
  if (t.dataset.svcToggle) {
    state.ytExpanded = !state.ytExpanded;
    return render();
  }
  if (t.dataset.soOpen !== undefined) { state.soOpen = true; return render(); }
  if (t.dataset.soClose !== undefined) { state.soOpen = false; return render(); }
  if (t.dataset.toggleLogin !== undefined) { SETTINGS.launchAtLogin = !SETTINGS.launchAtLogin; return render(); }

  if (t.dataset.cal) {
    if (t.dataset.cal === "prev") { state.calMonth--; if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; } }
    if (t.dataset.cal === "next") { state.calMonth++; if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; } }
    if (t.dataset.cal === "apply") return applyCustom();
    return render();
  }
  if (t.dataset.day) {
    const d = new Date(state.calYear, state.calMonth, +t.dataset.day);
    if (!state.customStart || (state.customStart && state.customEnd)) {
      state.customStart = d; state.customEnd = null;
    } else if (d < state.customStart) {
      state.customEnd = state.customStart; state.customStart = d;
    } else {
      state.customEnd = d;
    }
    state.range = "custom";
    return render();
  }
});

// drag-resize for variant B
let resizing = null;
document.addEventListener("mousedown", (e) => {
  const h = e.target.closest("[data-resize]");
  if (!h) return;
  resizing = { x: e.clientX, y: e.clientY, w: state.popW, h: state.popH };
  e.preventDefault();
});
document.addEventListener("mousemove", (e) => {
  if (!resizing) return;
  state.popW = Math.max(320, Math.min(640, resizing.w + (e.clientX - resizing.x)));
  state.popH = Math.max(360, Math.min(760, resizing.h + (e.clientY - resizing.y)));
  render();
});
document.addEventListener("mouseup", () => { resizing = null; });

// keyboard: arrows cycle variants (not while typing)
document.addEventListener("keydown", (e) => {
  const ae = document.activeElement || document.body;
  const tag = ae.tagName || "";
  if (tag === "INPUT" || tag === "TEXTAREA" || ae.isContentEditable) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});

// boot from ?variant=
const boot = new URL(location.href).searchParams.get("variant");
if (boot && ["A", "B", "C"].includes(boot.toUpperCase())) state.variant = boot.toUpperCase();
render();
</script>
</body>
