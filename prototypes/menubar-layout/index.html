<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WatchLogs — Menubar layout prototype (calendar-first, round 2)</title>
<!--
  PROTOTYPE — throwaway. Answers wayfinder ticket #7 on map #1.
  Mock data only, no build, no server. Double-click this file.
  Switch layouts: floating bar, arrow keys, or ?variant=A|B|D|E|F

  ROUND 1 (kept for reference — Aryan liked these, not C):
    A  Compact tabbed   360x520, range selector as a segmented control in the header
    B  Single scroll     420x600, resizable, panes stacked, settings slide-over

  ROUND 2 (calendar-first — the month grid IS the entry point, per feedback):
    D  Almanac    full month always visible, up to 3 service-colour dots per day,
                  preset chips, tabbed History | By Service below
    E  Telescope  calendar collapses to a one-row week strip for Today/Week and
                  expands to a full month for Month/Custom; single dot per day;
                  one continuous scroll below
    F  Dashboard  full month heat-tinted by watch time (no dots), an always-visible
                  By-Service summary bar, then the History feed — nothing hidden
-->
<style>
  :root {
    --wall-1: #2b3350;
    --wall-2: #6d5f8c;
    --wall-3: #c98d9b;
    --ink: #1d1f24;
    --ink-dim: #6b7280;
    --ink-faint: #9aa1ad;
    --panel: #f7f8fa;
    --panel-2: #eef0f4;
    --card: #ffffff;
    --line: #e2e5ea;
    --line-2: #d3d7de;
    --accent: #3b6ef5;
    --accent-soft: #e8effe;
    --yt: #ff0033;
    --nflx: #e50914;
    --twitch: #9146ff;
    --vimeo: #17b3e8;
    --good: #128a5b;
    --good-soft: #e2f4ec;
    --warn: #a8630b;
    --warn-soft: #fbeedd;
    --prov: #7a4fd0;
    --prov-soft: #efe8fb;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 13px/1.5 var(--sans);
    color: var(--ink);
    background: linear-gradient(150deg, var(--wall-1), var(--wall-2) 55%, var(--wall-3));
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- faux macOS menubar + desktop shell -------------------------------- */
  .menubar {
    position: fixed; inset: 0 0 auto 0; height: 26px; z-index: 50;
    background: rgba(255,255,255,.62);
    backdrop-filter: saturate(180%) blur(18px);
    -webkit-backdrop-filter: saturate(180%) blur(18px);
    display: flex; align-items: center; gap: 16px;
    padding: 0 12px; font-size: 12px; color: #1d1f24;
    border-bottom: 1px solid rgba(0,0,0,.08);
  }
  .menubar .mb-left { font-weight: 600; }
  .menubar .mb-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .menubar .mb-eye {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 7px; border-radius: 6px; background: rgba(59,110,245,.16);
    font-weight: 600; color: #23408c;
  }
  .menubar .mb-eye::before { content: "◉"; font-size: 11px; }

  .desk { min-height: 100%; padding: 26px 0 130px; display: flex; justify-content: flex-end; }
  .anchor { position: relative; margin: 8px 46px 0 0; }
  .beak {
    position: absolute; top: -7px; right: 26px; width: 14px; height: 14px;
    background: var(--card); transform: rotate(45deg);
    border-left: 1px solid rgba(0,0,0,.06); border-top: 1px solid rgba(0,0,0,.06); z-index: 2;
  }

  /* ---- the popover box -------------------------------------------------- */
  .popover {
    position: relative; z-index: 1;
    background: var(--card); border-radius: 12px;
    box-shadow: 0 18px 60px rgba(10,12,30,.42), 0 2px 8px rgba(10,12,30,.28);
    overflow: hidden; display: flex; flex-direction: column; color: var(--ink);
  }
  .variant-A .popover { width: 360px; height: 520px; }
  .variant-B .popover { width: 420px; height: 600px; }
  .variant-D .popover { width: 380px; height: 600px; }
  .variant-E .popover { width: 380px; height: 560px; }
  .variant-F .popover { width: 400px; height: 620px; }

  .readout {
    position: absolute; left: 0; right: 0; bottom: -30px;
    font: 11px/1.4 var(--mono); color: rgba(255,255,255,.85);
    text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,.5);
  }

  /* ---- shared bits ---------------------------------------------------- */
  .hd { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
  .app-name { font-weight: 700; font-size: 13px; letter-spacing: .01em; }
  .app-name .dot { color: var(--accent); }

  .seg { display: inline-flex; background: var(--panel-2); border-radius: 8px; padding: 2px; gap: 2px; }
  .seg button {
    font: 12px var(--sans); border: 0; background: transparent; color: var(--ink-dim);
    padding: 4px 9px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }

  .range-line { margin-top: 7px; font-size: 11.5px; color: var(--ink-dim); display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .range-line .res { font-family: var(--mono); color: var(--ink); }
  .range-line .sub { color: var(--ink-faint); }
  .spinner {
    width: 11px; height: 11px; border-radius: 50%;
    border: 2px solid var(--line-2); border-top-color: var(--accent);
    display: inline-block; animation: spin .7s linear infinite; vertical-align: -1px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .icon-btn {
    border: 1px solid var(--line-2); background: var(--card); color: var(--ink-dim);
    width: 26px; height: 26px; border-radius: 7px; cursor: pointer; font-size: 13px;
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--ink-faint); }

  .body { flex: 1; overflow: auto; }
  .body::-webkit-scrollbar { width: 9px; }
  .body::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 9px; border: 2px solid var(--card); }

  .foot {
    border-top: 1px solid var(--line); padding: 6px 12px;
    font: 10.5px/1.4 var(--mono); color: var(--ink-faint);
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .foot .off { text-decoration: line-through; }

  /* ---- History ------------------------------------------------------- */
  .day { border-bottom: 1px solid var(--line); }
  .day-hd {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 9px 14px; background: transparent; border: 0; cursor: pointer;
    font: inherit; text-align: left; color: var(--ink);
  }
  .day-hd:hover { background: var(--panel); }
  .day-hd .chev { color: var(--ink-faint); font-size: 10px; width: 10px; transition: transform .12s; }
  .day-hd.collapsed .chev { transform: rotate(-90deg); }
  .day-hd .d-name { font-weight: 650; }
  .day-hd .d-date { color: var(--ink-faint); font-size: 11.5px; }
  .day-hd .d-total { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); }
  .day-hd .d-span { display: block; font-size: 10.5px; color: var(--ink-faint); font-family: var(--mono); margin-top: 1px; }
  .prov-pill { font: 10px var(--sans); font-weight: 600; color: var(--prov); background: var(--prov-soft); border-radius: 999px; padding: 1px 7px; }
  .day-hd .d-total.prov { color: var(--prov); font-style: italic; }

  .views { padding: 2px 0 6px; }
  .view { display: grid; grid-template-columns: 14px 1fr auto; gap: 9px; padding: 6px 14px; align-items: start; }
  .view:hover { background: var(--panel); }
  .view .svc-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; }
  .view .v-main { min-width: 0; }
  .view .v-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 550; }
  .view .v-meta { font-size: 11px; color: var(--ink-dim); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 1px; }
  .tag { font: 10px var(--mono); padding: 0 5px; border-radius: 4px; background: var(--panel-2); color: var(--ink-dim); }
  .tag.fmt { background: #e9eefb; color: #2c4c9c; }
  .tag.emb { background: var(--warn-soft); color: var(--warn); }
  .tag.live { background: #fde8ec; color: var(--yt); }
  .view .v-time { font-family: var(--mono); font-size: 11.5px; color: var(--ink); text-align: right; white-space: nowrap; }
  .pos { grid-column: 2 / 4; height: 3px; border-radius: 3px; background: var(--panel-2); margin-top: 5px; overflow: hidden; }
  .pos > i { display: block; height: 100%; background: var(--line-2); }
  .more-row { padding: 8px 14px; font-size: 11.5px; color: var(--ink-faint); font-style: italic; }

  /* ---- By Service --------------------------------------------------- */
  .svc-scope { padding: 10px 14px 4px; font-size: 11.5px; color: var(--ink-dim); }
  .svc-scope b { color: var(--ink); font-weight: 600; }
  .svc { padding: 9px 14px; border-bottom: 1px solid var(--line); }
  .svc-top { display: flex; align-items: center; gap: 8px; }
  .svc-top .exp { border: 0; background: transparent; cursor: pointer; color: var(--ink-faint); font-size: 10px; width: 12px; padding: 0; }
  .svc-top .exp.spacer { visibility: hidden; }
  .svc-top .s-name { font-weight: 600; }
  .svc-top .s-name .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }
  .svc-top .s-total { margin-left: auto; font-family: var(--mono); font-size: 12px; }
  .svc .bar { height: 6px; border-radius: 4px; background: var(--panel-2); margin-top: 7px; overflow: hidden; }
  .svc .bar > i { display: block; height: 100%; background: var(--accent); opacity: .85; }
  .svc-kids { margin: 8px 0 2px; padding-left: 20px; display: grid; gap: 4px; }
  .svc-kids .k { display: flex; font-size: 11.5px; color: var(--ink-dim); }
  .svc-kids .k .kt { font-family: var(--mono); }
  .svc-kids .k .kn { margin-left: auto; font-family: var(--mono); color: var(--ink); }
  .svc-kids .emb-sub { font-size: 11px; color: var(--warn); border-top: 1px dashed var(--line-2); padding-top: 4px; margin-top: 2px; }
  .generic-note { font-size: 10.5px; color: var(--ink-faint); margin-top: 3px; }
  .adapter-group { background: var(--panel); }
  .adapter-hd {
    display: flex; align-items: center; gap: 7px; padding: 9px 14px 4px;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--warn);
  }
  .adapter-hd::before { content: "⚠"; }
  .adapter-sub { padding: 0 14px 6px; font-size: 11px; color: var(--ink-dim); }

  /* ---- Settings --------------------------------------------------- */
  .set { padding: 12px 14px; display: grid; gap: 14px; }
  .field { display: grid; gap: 4px; }
  .field label { font-weight: 600; font-size: 12px; }
  .field .hint { font-size: 11px; color: var(--ink-faint); }
  .field .ctl { display: flex; gap: 6px; align-items: center; }
  .field input[type=text], .field input[type=number] {
    font: 12px var(--mono); padding: 5px 8px; border: 1px solid var(--line-2);
    border-radius: 7px; background: var(--card); color: var(--ink); width: 100%;
  }
  .field input[readonly] { background: var(--panel-2); color: var(--ink-dim); }
  .field .mini { font: 11px var(--sans); padding: 4px 8px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--card); cursor: pointer; white-space: nowrap; }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .switch .track { width: 34px; height: 20px; border-radius: 999px; background: var(--line-2); position: relative; transition: background .12s; }
  .switch .track > i { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .12s; }
  .switch.on .track { background: var(--good); }
  .switch.on .track > i { left: 16px; }
  .step-row { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: 7px; overflow: hidden; }
  .step-row button { border: 0; background: var(--card); padding: 5px 10px; cursor: pointer; font: 13px var(--mono); }
  .step-row .val { padding: 5px 12px; font: 12px var(--mono); border-left: 1px solid var(--line-2); border-right: 1px solid var(--line-2); }

  /* ---- Categorical reserved slot -------------------------------- */
  .cat-stub { margin: 12px 14px; padding: 16px; border: 1.5px dashed var(--line-2); border-radius: 10px; text-align: center; color: var(--ink-faint); }
  .cat-stub .soon { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--accent); }

  /* ---- round-1 month grid overlay (A / B only) ------------------ */
  .cal { position: absolute; z-index: 20; background: var(--card); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: 0 10px 30px rgba(10,12,30,.28); padding: 10px; width: 232px; }
  .cal-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .cal-hd .m { font-weight: 650; font-size: 12px; }
  .cal-hd button { border: 0; background: transparent; cursor: pointer; color: var(--ink-dim); font-size: 13px; padding: 2px 6px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-grid .dow { font-size: 9.5px; color: var(--ink-faint); text-align: center; padding: 2px 0; text-transform: uppercase; }
  .cal-grid .cell { font: 11px var(--mono); text-align: center; padding: 5px 0; border-radius: 5px; cursor: pointer; color: var(--ink); user-select: none; }
  .cal-grid .cell.mut { color: var(--ink-faint); }
  .cal-grid .cell:hover { background: var(--panel-2); }
  .cal-grid .cell.in { background: var(--accent-soft); border-radius: 0; }
  .cal-grid .cell.end { background: var(--accent); color: #fff; }
  .cal-foot { margin-top: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--ink-dim); }
  .cal-foot button { font: 11px var(--sans); border: 1px solid var(--line-2); background: var(--card); border-radius: 6px; padding: 3px 10px; cursor: pointer; }

  /* ================= VARIANT A — compact tabbed ================= */
  .variant-A .a-tabs { display: flex; gap: 4px; padding: 8px 14px 0; }
  .variant-A .a-tabs .seg { flex: 1; }
  .variant-A .a-tabs .seg button { flex: 1; text-align: center; }
  .variant-A .a-tabs .gear { margin-left: 6px; }
  .variant-A .a-tabs .seg button:disabled { color: var(--ink-faint); cursor: default; }
  .variant-A .a-tabs .seg button:disabled .soon { font-size: 8px; display: block; letter-spacing: .06em; }

  /* ================= VARIANT B — single scroll ================= */
  .variant-B .b-hd { position: sticky; top: 0; z-index: 10; background: var(--card); }
  .variant-B .b-hd .row1 { display: flex; align-items: center; gap: 8px; padding: 12px 14px 0; }
  .variant-B .b-hd .row1 .app-name { margin-right: auto; }
  .b-section-hd {
    padding: 12px 14px 6px; font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .07em; color: var(--ink-faint); background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .slideover {
    position: absolute; inset: 0; background: var(--card); z-index: 30;
    display: flex; flex-direction: column; transform: translateX(100%); transition: transform .18s ease;
  }
  .slideover.open { transform: translateX(0); }
  .slideover .so-hd { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 700; }
  .slideover .so-hd button { border: 0; background: transparent; font-size: 15px; cursor: pointer; color: var(--ink-dim); }
  .variant-B .resize-h {
    position: absolute; right: 2px; bottom: 2px; width: 16px; height: 16px; cursor: nwse-resize; z-index: 40;
    background: linear-gradient(135deg, transparent 46%, var(--line-2) 46%, var(--line-2) 54%, transparent 54%, transparent 66%, var(--line-2) 66%, var(--line-2) 74%, transparent 74%);
  }

  /* ================= ROUND 2 — calendar-first shared header ================= */
  .cf-hd { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px; }
  .cf-hd .cf-id { display: flex; flex-direction: column; margin-right: auto; }
  .cf-hd .cf-id .n { font-weight: 700; font-size: 12.5px; }
  .cf-hd .cf-id .n .dot { color: var(--accent); }
  .cf-hd .cf-id .t { font: 11px var(--mono); color: var(--ink-dim); }
  .cf-hd .cf-id .t.prov { color: var(--prov); }

  .cf-chips { display: flex; gap: 4px; padding: 0 12px 8px; }
  .cf-chips button {
    flex: 1; font: 11.5px var(--sans); padding: 5px 0; border: 1px solid var(--line-2);
    background: var(--card); border-radius: 7px; cursor: pointer; color: var(--ink-dim);
  }
  .cf-chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  .cf-cal { padding: 0 12px 8px; border-bottom: 1px solid var(--line); position: relative; }
  .cf-cal-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; }
  .cf-cal-hd .m { font-weight: 650; font-size: 12px; }
  .cf-cal-hd .nav { display: flex; align-items: center; gap: 2px; }
  .cf-cal-hd button { border: 0; background: transparent; cursor: pointer; color: var(--ink-dim); padding: 2px 6px; font-size: 12px; }
  .cf-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
  .cf-grid .dow { font: 9px var(--sans); color: var(--ink-faint); text-align: center; padding: 2px 0 3px; text-transform: uppercase; letter-spacing: .04em; }
  .cf-cell {
    position: relative; text-align: center; padding: 5px 0 13px; font: 11px var(--mono);
    border-radius: 6px; cursor: pointer; color: var(--ink); user-select: none;
  }
  .cf-cell.mut { color: var(--ink-faint); }
  .cf-cell.oob { visibility: hidden; pointer-events: none; }
  .cf-cell:hover { background: var(--panel-2); }
  .cf-cell.inrange { background: var(--accent-soft); border-radius: 0; }
  .cf-cell.r-start { border-radius: 6px 0 0 6px; }
  .cf-cell.r-end { border-radius: 0 6px 6px 0; }
  .cf-cell .num { display: inline-block; width: 18px; line-height: 16px; }
  .cf-cell.today .num { background: var(--accent); color: #fff; border-radius: 50%; }
  .cf-cell.today.prov .num { background: var(--prov); }
  .cf-dots { position: absolute; left: 0; right: 0; bottom: 3px; display: flex; gap: 2px; justify-content: center; height: 5px; }
  .cf-dots i { width: 4px; height: 4px; border-radius: 50%; display: block; }
  .cf-dots i.ring { background: transparent; box-shadow: inset 0 0 0 1px var(--prov); }
  .cf-cal-note { font-size: 10px; color: var(--ink-faint); margin-top: 5px; display: flex; justify-content: space-between; }
  .cf-legend { display: flex; align-items: center; gap: 3px; }
  .cf-legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

  /* content controls under the calendar */
  .cf-swap { display: flex; padding: 8px 12px; gap: 6px; align-items: center; border-bottom: 1px solid var(--line); }
  .cf-swap .seg { flex: 1; }
  .cf-swap .seg button { flex: 1; text-align: center; }

  /* F — always-on service summary bar */
  .svc-mini {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 8px 12px; border: 0; border-bottom: 1px solid var(--line);
    background: var(--panel); cursor: pointer; font: 11px var(--mono); color: var(--ink-dim);
    overflow-x: auto; white-space: nowrap;
  }
  .svc-mini .mb-item { display: inline-flex; align-items: center; gap: 5px; }
  .svc-mini .mb-item i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .svc-mini .mb-more { margin-left: auto; color: var(--ink-faint); }

  /* ---- floating variant switcher (NOT part of the design) ---- */
  #switcher {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    z-index: 999; display: flex; align-items: center; gap: 2px;
    background: #0f1220; color: #fff; border-radius: 999px; padding: 5px 6px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5); font: 12px var(--sans);
  }
  #switcher button { border: 0; background: transparent; color: #fff; cursor: pointer; font-size: 15px; width: 30px; height: 28px; border-radius: 999px; }
  #switcher button:hover { background: rgba(255,255,255,.14); }
  #switcher .label { padding: 0 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #switcher .label b { font-weight: 700; }
  #switcher .label span { opacity: .6; margin-left: 6px; }
  .hint-note {
    position: fixed; left: 50%; bottom: 4px; transform: translateX(-50%);
    z-index: 999; color: rgba(255,255,255,.7); font: 10px var(--mono); text-shadow: 0 1px 2px rgba(0,0,0,.5);
  }
</style>
</head>
<body>
<div class="menubar">
  <span class="mb-left">WatchLogs</span>
  <span class="mb-right">
    <span class="mb-eye">2h 05m</span>
    <span>Fri 29 Aug&nbsp;&nbsp;9:41 PM</span>
  </span>
</div>

<div class="desk">
  <div class="anchor">
    <div class="beak"></div>
    <div id="stage"></div>
    <div class="readout" id="readout"></div>
  </div>
</div>

<div id="switcher"></div>
<div class="hint-note">← / → to switch layouts &nbsp;·&nbsp; ?variant=A|B|D|E|F</div>

<script>
/* ============================================================================
   MOCK DATA  — nothing here is real; it gives the layouts real density
   ========================================================================== */

const RANGES = {
  today: { label: "Today",      sub: "open day · provisional", res: "Fri Aug 29 (so far)" },

const NOW = { y: 2026, m: 7, d: 29 }; // Aug 29 2026 (m is 0-indexed)

// per-day activity for the calendar dots / heat — real for the HISTORY days,
// deterministic pseudo-fill for the rest of the month.
function dayActivity(d) {
  const fixed = {
    29: { svcs: ["youtube", "netflix"], mins: 125, prov: true },
    28: { svcs: ["netflix", "youtube", "vimeo"], mins: 212 },
    27: { svcs: ["twitch"], mins: 72 },
    25: { svcs: ["netflix", "youtube"], mins: 408 },
  };
  if (fixed[d]) return fixed[d];
  if (d > NOW.d) return { svcs: [], mins: 0 };           // not watched yet
  const seed = (d * 1103515245 + 12345) % 97;
  if (seed < 24) return { svcs: [], mins: 0 };           // a quiet day
  const pool = ["youtube", "netflix", "twitch", "vimeo"];
  const n = 1 + (seed % 3);
  return { svcs: pool.slice(0, n), mins: 15 + seed * 4 };
}

const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtMins = (m) => (m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`);

function rangeResolved() {
  if (state.range === "custom" && state.customStart && state.customEnd) {
    const f = (d) => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    return `${f(state.customStart)} – ${f(state.customEnd)}`;
  }
  return RANGES[state.range].res;
}
function rangeTotal() {
  if (state.range === "custom") {
    if (!(state.customStart && state.customEnd)) return "—";
    let sum = 0;
    for (let d = state.customStart.getDate(); d <= state.customEnd.getDate(); d++) sum += dayActivity(d).mins;
    return fmtMins(sum);
  }
  return RANGE_TOTAL[state.range];
}

// which August days the current range covers (mock month is always August)
function rangeDays() {
  if (state.range === "today") return [NOW.d, NOW.d];
  if (state.range === "week")  return [25, 29];
  if (state.range === "month") return [1, 29];
  if (state.customStart && state.customEnd) return [state.customStart.getDate(), state.customEnd.getDate()];
  if (state.customStart) return [state.customStart.getDate(), state.customStart.getDate()];
  return [0, -1];
}

function visibleDays() {
  if (state.range === "today") return HISTORY.filter((d) => d.id === "today");
  return HISTORY;
}

/* ---- round-1 overlay month grid (A / B) ---- */
function monthGrid(anchorCss) {
  const first = new Date(state.calYear, state.calMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(state.calYear, state.calMonth + 1, 0).getDate();
  const monthName = first.toLocaleDateString("en-US", { month: "long", year: "numeric" });
  const dows = ["S", "M", "T", "W", "T", "F", "S"].map((d) => `<div class="dow">${d}</div>`).join("");
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(`<div class="cell mut"></div>`);
  const s = state.customStart, e = state.customEnd;
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(state.calYear, state.calMonth, d);
    let cls = "cell";
    if (s && e && date >= s && date <= e) cls += " in";
    if ((s && +date === +s) || (e && +date === +e)) cls += " end";
    cells.push(`<div class="${cls}" data-day="${d}">${d}</div>`);
  }
  return `<div class="cal" style="${anchorCss}">
    <div class="cal-hd"><button data-cal="prev">‹</button><span class="m">${monthName}</span><button data-cal="next">›</button></div>
    <div class="cal-grid">${dows}${cells.join("")}</div>
    <div class="cal-foot"><span>${s && e ? "click Apply" : s ? "pick end day" : "pick start day"}</span><button data-cal="apply">Apply</button></div>
  </div>`;
}

// dotMode: "services" | "single" | "heat"
function cfCalendar(dotMode, opts = {}) {
  const collapsed = opts.collapsible && !state.calExpanded && (state.range === "today" || state.range === "week");
  const first = new Date(state.calYear, state.calMonth, 1);
  const monthName = first.toLocaleDateString("en-US", { month: "long", year: "numeric" });
  const dows = ["M", "T", "W", "T", "F", "S", "S"].map((d) => `<div class="dow">${d}</div>`).join("");
  const [rs, re] = rangeDays();

  // grid days: Monday-first
  let daySlots = [];
  if (collapsed) {
    // the week that contains "today": Aug 25 (Mon) .. Aug 31 (Sun)
    daySlots = [25, 26, 27, 28, 29, 30, 31].map((d) => ({ d, oob: d > 31 }));
  } else {
    const daysInMonth = new Date(state.calYear, state.calMonth + 1, 0).getDate();
    let lead = (first.getDay() + 6) % 7; // Monday = 0
    for (let i = 0; i < lead; i++) daySlots.push({ d: null });
    for (let d = 1; d <= daysInMonth; d++) daySlots.push({ d });
    while (daySlots.length % 7) daySlots.push({ d: null });
  }

  const cell = (slot) => {
    if (slot.d == null) return `<div class="cf-cell oob"></div>`;
    const d = slot.d;
    const act = dayActivity(d);
    const isToday = d === NOW.d;
    const inRange = d >= rs && d <= re;
    let cls = "cf-cell";
    if (d > NOW.d) cls += " mut";
    if (inRange) cls += " inrange";
    if (d === rs) cls += " r-start";
    if (d === re) cls += " r-end";
    if (isToday) cls += " today" + (act.prov ? " prov" : "");

    let mark = "";
    if (dotMode === "heat") {
      const a = Math.min(act.mins / 300, 1) * 0.55;
      if (a > 0.02) cls += "";
      const bg = a > 0.02 ? `background: rgba(59,110,245,${a.toFixed(2)});` : "";
      return `<div class="${cls}" data-day="${d}" style="${bg}"><span class="num">${d}</span>${
        act.prov ? `<div class="cf-dots"><i class="ring"></i></div>` : ""}</div>`;
    }
    if (dotMode === "single") {
      if (act.svcs.length) {
        const c = SVC_COLOR[act.svcs[0]] || "var(--ink-faint)";
        mark = `<div class="cf-dots"><i class="${act.prov ? "ring" : ""}" style="${act.prov ? "" : "background:" + c}"></i></div>`;
      }
    } else { // services
      mark = act.svcs.length
        ? `<div class="cf-dots">${act.svcs.slice(0, 3).map((s) =>
            `<i style="background:${SVC_COLOR[s] || "var(--ink-faint)"}"></i>`).join("")}</div>`
        : "";
    }
    return `<div class="${cls}" data-day="${d}"><span class="num">${d}</span>${mark}</div>`;
  };

  const legend = dotMode === "heat"
    ? `<span class="cf-legend">less <i style="background:rgba(59,110,245,.08)"></i><i style="background:rgba(59,110,245,.28)"></i><i style="background:rgba(59,110,245,.5)"></i> more</span>`
    : `<span class="cf-legend">dots = services watched</span>`;

  return `<div class="cf-cal">
    <div class="cf-cal-hd">
      <span class="m">${monthName}${collapsed ? " · week" : ""}</span>
      <span class="nav">
        ${opts.collapsible ? `<button data-cal-expand title="expand/collapse">${state.calExpanded || !collapsed && (state.range === "today" || state.range === "week") ? "▾" : "▸"}</button>` : ""}
        <button data-cal="prev">‹</button><button data-cal="next">›</button>
      </span>
    </div>
    <div class="cf-grid">${dows}${daySlots.map(cell).join("")}</div>
    <div class="cf-cal-note"><span>${esc(rangeResolved())}</span>${legend}</div>
  </div>`;
}

function historyPane() {
  const days = visibleDays().map((d) => {
    const isCollapsed = !!state.collapsed[d.id];
    const totalCls = d.provisional ? "d-total prov" : "d-total";
    const nameBit = d.date
      ? `<span class="d-name">${d.name}</span> <span class="d-date">${d.date}</span>`
      : `<span class="d-name">${d.name}</span>`;
    const provPill = d.provisional ? ` <span class="prov-pill">counting</span>` : "";
    const span = d.span ? `<span class="d-span">${esc(d.span)}</span>` : "";
    return `<div class="day">
      <button class="day-hd ${isCollapsed ? "collapsed" : ""}" data-day-toggle="${d.id}">
        <span class="chev">▼</span>
        <span>${nameBit}${provPill}${span}</span>
        <span class="${totalCls}">${esc(d.total)}</span>
      </button>
      ${isCollapsed ? "" : `<div class="views">${d.views.map(viewRow).join("")}</div>`}
    </div>`;
  }).join("");
  const moreRow = (state.range === "month" || state.range === "custom")
    ? `<div class="more-row">+ 21 earlier days in range — scroll to load</div>` : "";
  const provNote = visibleDays().some((d) => d.provisional)
    ? `<div class="more-row">“Today” is still open. Its total updates live and re-files into the right day at ~${SETTINGS.dayEndsAround}.</div>` : "";
  return days + moreRow + provNote;
}

   ========================================================================== */
function renderD() {
  return `<div class="popover">
    ${cfHeader()}
    ${cfChips()}
    ${cfCalendar("services")}
    <div class="cf-swap">
      <div class="seg">
        <button data-pane="history" class="${state.pane === "history" ? "on" : ""}">History</button>
        <button data-pane="services" class="${state.pane === "services" ? "on" : ""}">By Service</button>
      </div>
    </div>
    <div class="body">${state.pane === "services" ? servicesPane() : historyPane()}</div>
    <div class="foot"><span>range=${state.range} · pane=${state.pane}</span><span>380×600 · fixed</span></div>
    ${slideoverSettings()}
  </div>`;
}

/* ============================================================================
   ROUND 2 — VARIANT E (Telescope): calendar collapses to a week strip;
                                    one continuous scroll below
   ========================================================================== */
function renderE() {
  return `<div class="popover">
    ${cfHeader()}
    ${cfChips()}
    ${cfCalendar("single", { collapsible: true })}
    <div class="body">
      <div class="b-section-hd">History</div>${historyPane()}
      <div class="b-section-hd">By Service</div>${servicesPane()}
      <div class="b-section-hd">Categories</div>${catStub()}
    </div>
    <div class="foot"><span>range=${state.range} · cal=${state.calExpanded ? "full" : "auto"}</span><span>380×560 · fixed</span></div>
    ${slideoverSettings()}
  </div>`;
}

/* ============================================================================
   ROUND 2 — VARIANT F (Dashboard): heat calendar + always-on service bar +
                                    history feed. Nothing hidden.
   ========================================================================== */
function renderF() {
  const miniItems = BYSERVICE.ranked.map((s) =>
    `<span class="mb-item"><i style="background:${SVC_COLOR[s.key]}"></i>${esc(s.name)} ${esc(s.total)}</span>`).join("");
  const showServices = state.pane === "services";
  return `<div class="popover">
    ${cfHeader()}
    ${cfChips()}
    ${cfCalendar("heat")}
    <button class="svc-mini" data-pane="${showServices ? "history" : "services"}">
      ${miniItems}<span class="mb-more">${showServices ? "▾ collapse" : "▸ break down"}</span>
    </button>
    <div class="body">${showServices ? servicesPane() : historyPane()}</div>
    <div class="foot"><span>range=${state.range} · ${showServices ? "services open" : "history"}</span><span>400×620 · fixed</span></div>
    ${slideoverSettings()}
  </div>`;
}

/* ============================================================================
   RENDER + EVENTS
   ========================================================================== */

const RENDERERS = { A: renderA, B: renderB, D: renderD, E: renderE, F: renderF };
const VARIANT_NAMES = {
  A: "Compact tabbed · rd1", B: "Single scroll · rd1",
  D: "Almanac · cal+dots+tabs", E: "Telescope · collapsing cal+scroll", F: "Dashboard · heat+everything",
};
const ORDER = ["A", "B", "D", "E", "F"];

function render() {
  document.body.className = "variant-" + state.variant;
  $("#stage").innerHTML = RENDERERS[state.variant]();
  const P = $("#stage .popover");
  const w = P ? P.offsetWidth : 0, h = P ? P.offsetHeight : 0;
  $("#readout").textContent = `variant ${state.variant} · ${w}×${h} · range=${state.range} · total=${rangeTotal()} · pane=${state.pane}`;
  renderSwitcher();
}

function renderSwitcher() {
  $("#switcher").innerHTML = `
    <button data-cycle="-1">‹</button>
    <span class="label"><b>${state.variant}</b><span>${VARIANT_NAMES[state.variant]}</span></span>
    <button data-cycle="1">›</button>`;
}

function setVariant(v) {
  state.variant = v;
  if (v === "B" && state.pane === "settings") state.pane = "history";
  if ((v === "D" || v === "E" || v === "F") && !["history", "services"].includes(state.pane)) state.pane = "history";
  const url = new URL(location.href);
  url.searchParams.set("variant", v);
  history.replaceState(null, "", url);
  render();
}
function cycle(dir) {
  const i = (ORDER.indexOf(state.variant) + dir + ORDER.length) % ORDER.length;
  setVariant(ORDER[i]);
}

function pickRange(k) {
  state.range = k;
  if (k === "custom") {
    if (state.variant === "A" || state.variant === "B") state.calOpen = true;
  } else {
    state.calOpen = false;
    state.customStart = state.customEnd = null;
  }
  render();
}
function applyCustom() {
  state.calOpen = false;
  state.computing = true;
  render();
  setTimeout(() => { state.computing = false; render(); }, 450);
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-cycle],[data-range],[data-pane],[data-day-toggle],[data-svc-toggle],[data-cal],[data-cal-expand],[data-so-open],[data-so-close],[data-toggle-login],[data-day]");
  if (!t) {
    if (state.calOpen && !e.target.closest(".cal") && !e.target.closest(".range-seg")) { state.calOpen = false; render(); }
    return;
  }
  if (t.dataset.cycle) return cycle(+t.dataset.cycle);
  if (t.dataset.range) return pickRange(t.dataset.range);
  if (t.dataset.pane) { state.pane = t.dataset.pane; state.soOpen = false; return render(); }
  if (t.dataset.dayToggle) { const id = t.dataset.dayToggle; state.collapsed[id] = !state.collapsed[id]; return render(); }
  if (t.dataset.svcToggle) { state.ytExpanded = !state.ytExpanded; return render(); }
  if (t.dataset.soOpen !== undefined) { state.soOpen = true; return render(); }
  if (t.dataset.soClose !== undefined) { state.soOpen = false; return render(); }
  if (t.dataset.toggleLogin !== undefined) { SETTINGS.launchAtLogin = !SETTINGS.launchAtLogin; return render(); }
  if (t.dataset.calExpand !== undefined) { state.calExpanded = !state.calExpanded; return render(); }
  if (t.dataset.cal) {
    if (t.dataset.cal === "prev") { state.calMonth--; if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; } }
    if (t.dataset.cal === "next") { state.calMonth++; if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; } }
    if (t.dataset.cal === "apply") return applyCustom();
    return render();
  }
  if (t.dataset.day) {
    const d = new Date(state.calYear, state.calMonth, +t.dataset.day);
    if (!state.customStart || (state.customStart && state.customEnd)) { state.customStart = d; state.customEnd = null; }
    else if (d < state.customStart) { state.customEnd = state.customStart; state.customStart = d; }
    else { state.customEnd = d; }
    state.range = "custom";
    // round-2 variants aggregate live on the second click
    if (state.customStart && state.customEnd && state.variant !== "A" && state.variant !== "B") return applyCustom();
    return render();
  }
});

// drag-resize for variant B
let resizing = null;
document.addEventListener("mousedown", (e) => {
  const h = e.target.closest("[data-resize]");
  if (!h) return;
  resizing = { x: e.clientX, y: e.clientY, w: state.popW, h: state.popH };
  e.preventDefault();
});
document.addEventListener("mousemove", (e) => {
  if (!resizing) return;
  state.popW = Math.max(320, Math.min(640, resizing.w + (e.clientX - resizing.x)));
  state.popH = Math.max(360, Math.min(760, resizing.h + (e.clientY - resizing.y)));
  render();
});
document.addEventListener("mouseup", () => { resizing = null; });

// keyboard: arrows cycle variants (not while typing)
document.addEventListener("keydown", (e) => {
  const ae = document.activeElement || document.body;
  const tag = ae.tagName || "";
  if (tag === "INPUT" || tag === "TEXTAREA" || ae.isContentEditable) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});

const boot = new URL(location.href).searchParams.get("variant");
if (boot && ORDER.includes(boot.toUpperCase())) state.variant = boot.toUpperCase();
render();
</script>
</body>
</html>
