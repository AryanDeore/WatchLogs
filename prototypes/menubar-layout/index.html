<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WatchLogs — Menubar layout prototype (round 3: shrunk calendar + Trends pane)</title>
<!--
  PROTOTYPE — throwaway. Answers wayfinder ticket #7 on map #1.
  Mock data only, no build, no server. Double-click. Switch: bar / arrows / ?variant=G|H|I

  Round 1 (A/B/C) and round 2 (D/E/F) are in this branch's git history.
  Decisions carried in from those rounds:
    - Panes are SEPARATE (History / By Service / Trends / Settings) — different
      grains of information, tabbed not stacked.
    - Calendar is NOT the hero. It shrinks to a compact week strip pinned on
      top as the entry point; a month grid drops down only for Custom.
    - Per-day overview (magnitude + Service mix) lives in a new TRENDS pane:
      one stacked bar per day across the selected range.
    - Service summary strip under the range control (from F), now with icons.
    - By Service bars are part-to-whole: track = 100% of watched time in range,
      fill = that Service's share; the needs-an-Adapter bucket is in the total.
    - History's per-video bar = how much of that video you've watched (coverage);
      blank for live / unknown duration.

  What G / H / I disagree about:
    G  week strip on top · 4 tabs incl. Settings · Trends = vertical columns
    H  range dropdown only (most compact top) · Settings = gear · Trends = horizontal bars
    I  week strip on top · 4 tabs · lands on TRENDS by default · vertical columns
-->
<style>
  :root {
    --wall-1: #2b3350; --wall-2: #6d5f8c; --wall-3: #c98d9b;
    --ink: #1d1f24; --ink-dim: #6b7280; --ink-faint: #9aa1ad;
    --panel: #f7f8fa; --panel-2: #eef0f4; --card: #ffffff;
    --line: #e2e5ea; --line-2: #d3d7de;
    --accent: #3b6ef5; --accent-soft: #e8effe;
    --yt: #ff0033; --nflx: #e50914; --twitch: #9146ff; --other: #98a0ad;
    --good: #128a5b; --warn: #a8630b; --warn-soft: #fbeedd;
    --prov: #7a4fd0; --prov-soft: #efe8fb;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font: 13px/1.5 var(--sans); color: var(--ink);
    background: linear-gradient(150deg, var(--wall-1), var(--wall-2) 55%, var(--wall-3));
    background-attachment: fixed; -webkit-font-smoothing: antialiased;
  }

  /* faux macOS menubar + desktop */
  .menubar {
    position: fixed; inset: 0 0 auto 0; height: 26px; z-index: 50;
    background: rgba(255,255,255,.62); backdrop-filter: saturate(180%) blur(18px);
    -webkit-backdrop-filter: saturate(180%) blur(18px);
    display: flex; align-items: center; gap: 16px; padding: 0 12px;
    font-size: 12px; color: #1d1f24; border-bottom: 1px solid rgba(0,0,0,.08);
  }
  .menubar .mb-left { font-weight: 600; }
  .menubar .mb-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .menubar .mb-eye { display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px; border-radius: 6px; background: rgba(59,110,245,.16); font-weight: 600; color: #23408c; }
  .menubar .mb-eye::before { content: "◉"; font-size: 11px; }
  .desk { min-height: 100%; padding: 26px 0 130px; display: flex; justify-content: flex-end; }
  .anchor { position: relative; margin: 8px 46px 0 0; }
  .beak { position: absolute; top: -7px; right: 26px; width: 14px; height: 14px; background: var(--card); transform: rotate(45deg); border-left: 1px solid rgba(0,0,0,.06); border-top: 1px solid rgba(0,0,0,.06); z-index: 2; }

  .popover {
    position: relative; z-index: 1; background: var(--card); border-radius: 12px;
    box-shadow: 0 18px 60px rgba(10,12,30,.42), 0 2px 8px rgba(10,12,30,.28);
    overflow: hidden; display: flex; flex-direction: column; color: var(--ink);
  }
  .variant-G .popover { width: 380px; height: 560px; }
  .variant-H .popover { width: 380px; height: 560px; }
  .variant-I .popover { width: 380px; height: 560px; }
  .readout { position: absolute; left: 0; right: 0; bottom: -30px; font: 11px/1.4 var(--mono); color: rgba(255,255,255,.85); text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,.5); }

  /* ---------- top: range control ---------- */
  .top { border-bottom: 1px solid var(--line); }
  .top-id { display: flex; align-items: center; gap: 8px; padding: 9px 12px 0; }
  .top-id .n { font-weight: 700; font-size: 12.5px; }
  .top-id .n .dot { color: var(--accent); }
  .top-id .tot { font: 11px var(--mono); color: var(--ink-dim); }
  .top-id .tot.prov { color: var(--prov); }
  .top-id .sp { margin-left: auto; }

  .chips { display: flex; gap: 4px; padding: 8px 12px; }
  .chips button { flex: 1; font: 11.5px var(--sans); padding: 5px 0; border: 1px solid var(--line-2); background: var(--card); border-radius: 7px; cursor: pointer; color: var(--ink-dim); }
  .chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  /* compact week strip */
  .wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; padding: 0 12px 8px; }
  .wk-cell { position: relative; text-align: center; padding: 3px 0 8px; border-radius: 6px; cursor: pointer; user-select: none; }
  .wk-cell:hover { background: var(--panel-2); }
  .wk-cell.inrange { background: var(--accent-soft); border-radius: 0; }
  .wk-cell.r-start { border-radius: 6px 0 0 6px; }
  .wk-cell.r-end { border-radius: 0 6px 6px 0; }
  .wk-cell .dow { font: 8.5px var(--sans); color: var(--ink-faint); text-transform: uppercase; letter-spacing: .04em; }
  .wk-cell .dnum { font: 11px var(--mono); display: inline-block; width: 18px; line-height: 16px; margin-top: 1px; }
  .wk-cell.today .dnum { background: var(--accent); color: #fff; border-radius: 50%; }
  .wk-cell.today.prov .dnum { background: var(--prov); }
  .wk-cell.fut { color: var(--ink-faint); }
  .wk-bar { position: absolute; left: 50%; transform: translateX(-50%); bottom: 3px; height: 3px; border-radius: 2px; background: var(--ink-faint); }
  .wk-bar.prov { background: repeating-linear-gradient(90deg, var(--prov) 0 2px, transparent 2px 4px); }
  .wk-note { padding: 0 12px 8px; font: 10.5px var(--mono); color: var(--ink-faint); display: flex; justify-content: space-between; }

  /* range dropdown (variant H) */
  .rng-dd { position: relative; padding: 8px 12px; }
  .rng-dd > button { width: 100%; text-align: left; border: 1px solid var(--line-2); background: var(--card); border-radius: 8px; padding: 8px 10px; cursor: pointer; font: 12px var(--sans); display: flex; align-items: center; }
  .rng-dd > button .lbl { font-weight: 600; }
  .rng-dd > button .rv { font: 11px var(--mono); color: var(--ink-dim); margin-left: 8px; }
  .rng-dd > button .car { margin-left: auto; color: var(--ink-faint); }
  .rng-panel { position: absolute; left: 12px; right: 12px; top: 46px; z-index: 30; background: var(--card); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: 0 12px 34px rgba(10,12,30,.3); padding: 8px; }
  .rng-panel .pre { display: flex; gap: 4px; margin-bottom: 8px; }
  .rng-panel .pre button { flex: 1; font: 11px var(--sans); padding: 5px 0; border: 1px solid var(--line-2); background: var(--card); border-radius: 6px; cursor: pointer; color: var(--ink-dim); }
  .rng-panel .pre button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* shared month grid (Custom) */
  .cal { background: var(--card); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px; }
  .cal.float { position: absolute; z-index: 30; box-shadow: 0 12px 34px rgba(10,12,30,.3); width: 244px; }
  .cal-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
  .cal-hd .m { font-weight: 650; font-size: 12px; }
  .cal-hd button { border: 0; background: transparent; cursor: pointer; color: var(--ink-dim); font-size: 13px; padding: 2px 6px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-grid .dow { font: 9px var(--sans); color: var(--ink-faint); text-align: center; padding: 2px 0; text-transform: uppercase; }
  .cal-grid .cell { font: 11px var(--mono); text-align: center; padding: 5px 0; border-radius: 5px; cursor: pointer; user-select: none; }
  .cal-grid .cell.mut { color: var(--ink-faint); }
  .cal-grid .cell:hover { background: var(--panel-2); }
  .cal-grid .cell.in { background: var(--accent-soft); border-radius: 0; }
  .cal-grid .cell.end { background: var(--accent); color: #fff; border-radius: 5px; }
  .cal-foot { margin-top: 7px; display: flex; justify-content: space-between; align-items: center; font: 11px var(--sans); color: var(--ink-dim); }
  .cal-foot button { font: 11px var(--sans); border: 1px solid var(--line-2); background: var(--card); border-radius: 6px; padding: 3px 10px; cursor: pointer; }

  /* ---------- service summary strip (icons) ---------- */
  .svc-strip {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    padding: 7px 12px; border: 0; border-bottom: 1px solid var(--line);
    background: var(--panel); cursor: pointer; font: 11px var(--mono); color: var(--ink-dim);
    overflow-x: auto; white-space: nowrap;
  }
  .svc-strip .it { display: inline-flex; align-items: center; gap: 5px; }
  .svc-strip .ic { width: 15px; height: 15px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; color: #fff; font: 700 9px var(--sans); }
  .svc-strip .more { margin-left: auto; color: var(--ink-faint); }

  /* ---------- tabs ---------- */
  .tabs { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-bottom: 1px solid var(--line); }
  .tabs .seg { display: flex; flex: 1; background: var(--panel-2); border-radius: 8px; padding: 2px; gap: 2px; }
  .tabs .seg button { flex: 1; font: 11.5px var(--sans); border: 0; background: transparent; color: var(--ink-dim); padding: 4px 0; border-radius: 6px; cursor: pointer; }
  .tabs .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }
  .icon-btn { border: 1px solid var(--line-2); background: var(--card); color: var(--ink-dim); width: 27px; height: 27px; border-radius: 7px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; padding: 0; flex: none; }
  .icon-btn:hover { color: var(--ink); border-color: var(--ink-faint); }

  .body { flex: 1; overflow: auto; }
  .body::-webkit-scrollbar { width: 9px; }
  .body::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 9px; border: 2px solid var(--card); }
  .foot { border-top: 1px solid var(--line); padding: 6px 12px; font: 10.5px/1.4 var(--mono); color: var(--ink-faint); display: flex; justify-content: space-between; gap: 8px; }

  /* ---------- History ---------- */
  .pane-note { padding: 8px 14px 4px; font-size: 11px; color: var(--ink-faint); }
  .day { border-bottom: 1px solid var(--line); }
  .day-hd { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 14px; background: transparent; border: 0; cursor: pointer; font: inherit; text-align: left; color: var(--ink); }
  .day-hd:hover { background: var(--panel); }
  .day-hd .chev { color: var(--ink-faint); font-size: 10px; width: 10px; transition: transform .12s; }
  .day-hd.collapsed .chev { transform: rotate(-90deg); }
  .day-hd .d-name { font-weight: 650; }
  .day-hd .d-date { color: var(--ink-faint); font-size: 11.5px; }
  .day-hd .d-total { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); }
  .day-hd .d-span { display: block; font-size: 10.5px; color: var(--ink-faint); font-family: var(--mono); margin-top: 1px; }
  .prov-pill { font: 10px var(--sans); font-weight: 600; color: var(--prov); background: var(--prov-soft); border-radius: 999px; padding: 1px 7px; }
  .day-hd .d-total.prov { color: var(--prov); font-style: italic; }
  .views { padding: 2px 0 6px; }
  .view { display: grid; grid-template-columns: 14px 1fr auto; gap: 9px; padding: 6px 14px; align-items: start; }
  .view:hover { background: var(--panel); }
  .view .svc-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; }
  .view .v-main { min-width: 0; }
  .view .v-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 550; }
  .view .v-meta { font-size: 11px; color: var(--ink-dim); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 1px; }
  .tag { font: 10px var(--mono); padding: 0 5px; border-radius: 4px; background: var(--panel-2); color: var(--ink-dim); }
  .tag.fmt { background: #e9eefb; color: #2c4c9c; }
  .tag.emb { background: var(--warn-soft); color: var(--warn); }
  .tag.live { background: #fde8ec; color: var(--yt); }
  .view .v-time { font-family: var(--mono); font-size: 11.5px; color: var(--ink); text-align: right; white-space: nowrap; }
  .cov { grid-column: 2 / 4; height: 3px; border-radius: 3px; background: var(--panel-2); margin-top: 5px; overflow: hidden; }
  .cov > i { display: block; height: 100%; background: var(--accent); opacity: .55; }
  .cov-live { grid-column: 2 / 4; margin-top: 4px; font: 10px var(--mono); color: var(--ink-faint); }
  .more-row { padding: 8px 14px; font-size: 11.5px; color: var(--ink-faint); font-style: italic; }

  /* ---------- By Service ---------- */
  .svc-scope { padding: 10px 14px 4px; font-size: 11.5px; color: var(--ink-dim); }
  .svc-scope b { color: var(--ink); font-weight: 600; }
  .svc { padding: 9px 14px; border-bottom: 1px solid var(--line); }
  .svc-top { display: flex; align-items: center; gap: 8px; }
  .svc-top .exp { border: 0; background: transparent; cursor: pointer; color: var(--ink-faint); font-size: 10px; width: 12px; padding: 0; }
  .svc-top .exp.spacer { visibility: hidden; }
  .svc-top .s-ic { width: 15px; height: 15px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; color: #fff; font: 700 9px var(--sans); flex: none; }
  .svc-top .s-name { font-weight: 600; }
  .svc-top .s-share { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); }
  .svc-top .s-total { font-family: var(--mono); font-size: 12px; margin-left: 8px; }
  .svc .bar { height: 7px; border-radius: 4px; background: var(--panel-2); margin-top: 7px; overflow: hidden; }
  .svc .bar > i { display: block; height: 100%; }
  .svc-kids { margin: 8px 0 2px; padding-left: 23px; display: grid; gap: 5px; }
  .svc-kids .k { font-size: 11px; color: var(--ink-dim); }
  .svc-kids .k .kl { display: flex; }
  .svc-kids .k .kl .kn { margin-left: auto; font-family: var(--mono); color: var(--ink); }
  .svc-kids .k .kbar { height: 4px; border-radius: 3px; background: var(--panel-2); margin-top: 2px; overflow: hidden; }
  .svc-kids .k .kbar > i { display: block; height: 100%; background: var(--yt); opacity: .5; }
  .svc-kids .emb-sub { font-size: 10.5px; color: var(--warn); border-top: 1px dashed var(--line-2); padding-top: 4px; margin-top: 2px; }
  .generic-note { font-size: 10.5px; color: var(--ink-faint); margin-top: 3px; }
  .adapter-hd { display: flex; align-items: center; gap: 7px; padding: 10px 14px 2px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--warn); }
  .adapter-hd::before { content: "⚠"; }
  .adapter-sub { padding: 0 14px 4px; font-size: 11px; color: var(--ink-dim); }

  /* ---------- Trends ---------- */
  .tr-wrap { padding: 12px 14px 8px; }
  .tr-scope { font-size: 11.5px; color: var(--ink-dim); margin-bottom: 10px; }
  .tr-scope b { color: var(--ink); }
  .tr-legend { display: flex; gap: 12px; flex-wrap: wrap; font: 10.5px var(--sans); color: var(--ink-dim); margin-top: 10px; }
  .tr-legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 4px; vertical-align: 0; }
  .tr-hint { font: 10.5px var(--sans); color: var(--ink-faint); margin-top: 8px; }

  /* vertical columns (G / I) */
  .tr-cols { display: flex; align-items: flex-end; gap: 4px; height: 150px; border-bottom: 1px solid var(--line-2); padding-bottom: 0; }
  .tr-cols.month { gap: 2px; }
  .tr-col { flex: 1; display: flex; flex-direction: column-reverse; min-width: 0; position: relative; }
  .tr-col .seg { width: 100%; }
  .tr-col .cap { position: absolute; top: -12px; left: 0; right: 0; height: 4px; background: repeating-linear-gradient(90deg, var(--prov) 0 2px, transparent 2px 4px); }
  .tr-xax { display: flex; gap: 4px; margin-top: 4px; }
  .tr-xax.month { gap: 2px; }
  .tr-xax span { flex: 1; text-align: center; font: 9px var(--mono); color: var(--ink-faint); overflow: hidden; }
  .tr-ymax { font: 9.5px var(--mono); color: var(--ink-faint); margin-bottom: 2px; }

  /* horizontal bars (H) */
  .tr-rows { display: grid; gap: 6px; }
  .tr-row { display: grid; grid-template-columns: 46px 1fr 52px; gap: 8px; align-items: center; }
  .tr-row .rl { font: 10px var(--mono); color: var(--ink-faint); text-align: right; }
  .tr-row .rt { height: 14px; border-radius: 4px; background: var(--panel-2); overflow: hidden; display: flex; }
  .tr-row .rt > i { height: 100%; display: block; }
  .tr-row .rv { font: 10px var(--mono); color: var(--ink-dim); }
  .tr-row.zero .rt { background: repeating-linear-gradient(45deg, var(--panel-2) 0 4px, var(--card) 4px 8px); }

  /* ---------- Settings ---------- */
  .set { padding: 12px 14px; display: grid; gap: 14px; }
  .field { display: grid; gap: 4px; }
  .field label { font-weight: 600; font-size: 12px; }
  .field .hint { font-size: 11px; color: var(--ink-faint); }
  .field .ctl { display: flex; gap: 6px; align-items: center; }
  .field input[type=text], .field input[type=number] { font: 12px var(--mono); padding: 5px 8px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--card); color: var(--ink); width: 100%; }
  .field input[readonly] { background: var(--panel-2); color: var(--ink-dim); }
  .field .mini { font: 11px var(--sans); padding: 4px 8px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--card); cursor: pointer; white-space: nowrap; }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .switch .track { width: 34px; height: 20px; border-radius: 999px; background: var(--line-2); position: relative; transition: background .12s; }
  .switch .track > i { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .12s; }
  .switch.on .track { background: var(--good); }
  .switch.on .track > i { left: 16px; }
  .step-row { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: 7px; overflow: hidden; }
  .step-row button { border: 0; background: var(--card); padding: 5px 10px; cursor: pointer; font: 13px var(--mono); }
  .step-row .val { padding: 5px 12px; font: 12px var(--mono); border-left: 1px solid var(--line-2); border-right: 1px solid var(--line-2); }

  .cat-stub { margin: 12px 14px; padding: 16px; border: 1.5px dashed var(--line-2); border-radius: 10px; text-align: center; color: var(--ink-faint); }
  .cat-stub .soon { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--accent); }

  /* settings slide-over (H) */
  .slideover { position: absolute; inset: 0; background: var(--card); z-index: 40; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .18s ease; }
  .slideover.open { transform: translateX(0); }
  .slideover .so-hd { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 700; }
  .slideover .so-hd button { border: 0; background: transparent; font-size: 15px; cursor: pointer; color: var(--ink-dim); }

  /* floating switcher (NOT part of the design) */
  #switcher { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 999; display: flex; align-items: center; gap: 2px; background: #0f1220; color: #fff; border-radius: 999px; padding: 5px 6px; box-shadow: 0 10px 40px rgba(0,0,0,.5); font: 12px var(--sans); }
  #switcher button { border: 0; background: transparent; color: #fff; cursor: pointer; font-size: 15px; width: 30px; height: 28px; border-radius: 999px; }
  #switcher button:hover { background: rgba(255,255,255,.14); }
  #switcher .label { padding: 0 12px; white-space: nowrap; }
  #switcher .label b { font-weight: 700; }
  #switcher .label span { opacity: .6; margin-left: 6px; }
  .hint-note { position: fixed; left: 50%; bottom: 4px; transform: translateX(-50%); z-index: 999; color: rgba(255,255,255,.7); font: 10px var(--mono); text-shadow: 0 1px 2px rgba(0,0,0,.5); }
</style>
</head>
<body>
<div class="menubar">
  <span class="mb-left">WatchLogs</span>
  <span class="mb-right"><span class="mb-eye">2h 05m</span><span>Fri 29 Aug&nbsp;&nbsp;9:41 PM</span></span>
</div>
<div class="desk"><div class="anchor"><div class="beak"></div><div id="stage"></div><div class="readout" id="readout"></div></div></div>
<div id="switcher"></div>
<div class="hint-note">← / → to switch layouts &nbsp;·&nbsp; ?variant=G|H|I</div>

<script>
/* ============================================================================
   MOCK DATA — one source of truth so History, By Service and Trends reconcile
   ========================================================================== */

/* ============================================================================
   DERIVATIONS
   ========================================================================== */

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtMins = (m) => { m = Math.round(m); return m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`; };

function rangeDays() {
  if (state.range === "custom") {
    if (state.customStart && state.customEnd) return [state.customStart.getDate(), state.customEnd.getDate()];
    if (state.customStart) return [state.customStart.getDate(), state.customStart.getDate()];
    return [0, -1];
  }
  return RANGES[state.range].days;
}
function dayTotal(d) { return SVC_ORDER.reduce((a, k) => a + ((DAILY[d] && DAILY[d][k]) || 0), 0); }
function dayIsProv(d) { return !!(DAILY[d] && DAILY[d].prov); }
function rangeDayList() { const [a, b] = rangeDays(); const out = []; for (let d = a; d <= b; d++) out.push(d); return out; }
function svcTotals() {
  const t = { youtube: 0, netflix: 0, twitch: 0, other: 0 };
  for (const d of rangeDayList()) for (const k of SVC_ORDER) t[k] += (DAILY[d] && DAILY[d][k]) || 0;
  return t;
}
function grandTotal() { const t = svcTotals(); return SVC_ORDER.reduce((a, k) => a + t[k], 0); }
function rangeResolved() {
  const [a, b] = rangeDays();
  if (a > b) return "—";
  const f = (dd) => new Date(2026, 7, dd).toLocaleDateString("en-US", { month: "short", day: "numeric" });
  return a === b ? f(a) : `${f(a)} – ${f(b)}`;
}
function isProvRange() { return rangeDayList().some(dayIsProv); }

   ========================================================================== */
const state = {

/* ============================================================================

function chips() {
  return `<div class="chips">${["today", "week", "month", "custom"].map((k) =>
    `<button data-range="${k}" class="${state.range === k ? "on" : ""}">${RANGES[k].label}</button>`).join("")}</div>`;
}

function weekStrip() {
  const [rs, re] = rangeDays();
  const dows = ["M", "T", "W", "T", "F", "S", "S"];
  const week = [25, 26, 27, 28, 29, 30, 31];
  const maxT = Math.max(...week.map(dayTotal), 1);
  const cells = week.map((d, i) => {
    const tot = dayTotal(d);
    const isToday = d === NOW.d, fut = d > NOW.d, inR = d >= rs && d <= re;
    let cls = "wk-cell";
    if (fut) cls += " fut";
    if (inR) cls += " inrange";
    if (d === rs) cls += " r-start";
    if (d === re) cls += " r-end";
    if (isToday) cls += " today" + (dayIsProv(d) ? " prov" : "");
    const bar = tot > 0 ? `<span class="wk-bar ${dayIsProv(d) ? "prov" : ""}" style="width:${Math.max(6, Math.round(tot / maxT * 22))}px"></span>` : "";
    return `<div class="${cls}" data-day="${d}"><span class="dow">${dows[i]}</span><br><span class="dnum">${d}</span>${bar}</div>`;
  }).join("");
  return `<div class="wk">${cells}</div>
    <div class="wk-note"><span>${RANGES[state.range].label} · ${esc(rangeResolved())}</span><span>underline = watch time</span></div>
    ${state.range === "custom" ? floatCal("left:12px;right:12px;top:calc(100% - 4px);position:absolute") : ""}`;
}

function floatCal(style) {
  const first = new Date(state.calYear, state.calMonth, 1);
  const dim = new Date(state.calYear, state.calMonth + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7;
  const mName = first.toLocaleDateString("en-US", { month: "long", year: "numeric" });
  const dows = ["M", "T", "W", "T", "F", "S", "S"].map((x) => `<div class="dow">${x}</div>`).join("");
  const s = state.customStart, e = state.customEnd;
  let cells = "";
  for (let i = 0; i < lead; i++) cells += `<div class="cell mut"></div>`;
  for (let d = 1; d <= dim; d++) {
    const dt = new Date(state.calYear, state.calMonth, d);
    let c = "cell";
    if (s && e && dt >= s && dt <= e) c += " in";
    if ((s && +dt === +s) || (e && +dt === +e)) c += " end";
    cells += `<div class="${c}" data-day="${d}">${d}</div>`;
  }
  return `<div class="cal float" style="${style}">
    <div class="cal-hd"><button data-cal="prev">‹</button><span class="m">${mName}</span><button data-cal="next">›</button></div>
    <div class="cal-grid">${dows}${cells}</div>
    <div class="cal-foot"><span>${s && e ? "range set" : s ? "pick end day" : "pick start day"}</span><button data-cal="apply">Done</button></div>
  </div>`;
}

function svcDot(k) { return `<span class="svc-dot" style="background:${(SVC[k] || SVC.other).color}"></span>`; }

function historyPane() {
  const list = state.range === "today" ? HISTORY.filter((d) => d.id === "today") : HISTORY;
  const rows = list.map((d) => {
    const collapsed = !!state.collapsed[d.id];
    const total = fmtMins(dayTotal(d.dom));
    const nameBit = d.date ? `<span class="d-name">${d.name}</span> <span class="d-date">${d.date}</span>` : `<span class="d-name">${d.name}</span>`;
    const pill = d.provisional ? ` <span class="prov-pill">counting</span>` : "";
    const span = d.span ? `<span class="d-span">${esc(d.span)}</span>` : "";
    const views = d.views.map((v) => {
      const tags = [];
      if (v.fmt && v.fmt !== "standard") tags.push(`<span class="tag ${v.fmt === "live" ? "live" : "fmt"}">${v.fmt}</span>`);
      if (v.embedded) tags.push(`<span class="tag emb">embedded</span>`);
      const cov = v.cov == null
        ? `<div class="cov-live">live · no fixed length</div>`
        : `<div class="cov" title="${Math.round(v.cov * 100)}% of the video watched"><i style="width:${Math.round(v.cov * 100)}%"></i></div>`;
      return `<div class="view">${svcDot(v.svc)}
        <div class="v-main"><div class="v-title">${esc(v.title)}</div>
          <div class="v-meta"><span>${esc(v.author)}</span><span>·</span><span>${esc(v.at)}</span>${tags.join("")}</div></div>
        <div class="v-time">${esc(v.watched)}</div>${cov}</div>`;
    }).join("");
    return `<div class="day">
      <button class="day-hd ${collapsed ? "collapsed" : ""}" data-day-toggle="${d.id}">
        <span class="chev">▼</span><span>${nameBit}${pill}${span}</span>
        <span class="d-total ${d.provisional ? "prov" : ""}">${total}</span>
      </button>${collapsed ? "" : `<div class="views">${views}</div>`}</div>`;
  }).join("");
  const note = `<div class="pane-note">Bar under each video = how much of it you've watched. “Today” updates live and re-files at ~${SETTINGS.dayEndsAround}.</div>`;
  const more = (state.range === "month" || state.range === "custom") ? `<div class="more-row">+ earlier days in range — scroll to load</div>` : "";
  return note + rows + more;
}

function byServicePane() {
  const t = svcTotals(), grand = grandTotal() || 1;
  const scope = `<div class="svc-scope">Share of watched time · <b>${RANGES[state.range].label}</b> · ${esc(rangeResolved())} · ${fmtMins(grand)} total</div>`;
  const real = ["youtube", "netflix", "twitch"].filter((k) => t[k] > 0).map((k) => {
    const frac = t[k] / grand;
    const expandable = k === "youtube";
    const open = expandable && state.ytExpanded;
    const exp = expandable ? `<button class="exp" data-svc-toggle>${open ? "▼" : "▶"}</button>` : `<button class="exp spacer">▶</button>`;
    const kids = open ? `<div class="svc-kids">
      ${YT_SPLIT.map((c) => `<div class="k"><div class="kl"><span>${c.label}</span><span class="kn">${fmtMins(t.youtube * c.frac)}</span></div>
        <div class="kbar"><i style="width:${Math.round(c.frac * 100)}%"></i></div></div>`).join("")}
      <div class="k emb-sub"><div class="kl"><span>— of which embedded</span><span class="kn">${fmtMins(t.youtube * YT_EMBEDDED_FRAC)}</span></div></div>
    </div>` : "";
    return `<div class="svc"><div class="svc-top">${exp}
      <span class="s-ic" style="background:${SVC[k].color}">${SVC[k].mono}</span>
      <span class="s-name">${SVC[k].name}</span>
      <span class="s-share">${Math.round(frac * 100)}%</span><span class="s-total">${fmtMins(t[k])}</span></div>
      <div class="bar"><i style="width:${Math.round(frac * 100)}%;background:${SVC[k].color};opacity:.8"></i></div>${kids}</div>`;
  }).join("");
  const otherFrac = t.other / grand;
  const adapter = t.other > 0 ? `<div class="adapter-hd">Other sites — need an Adapter</div>
    <div class="adapter-sub">${Math.round(otherFrac * 100)}% of the range · ${fmtMins(t.other)}. Counted, but metadata is thin.</div>
    <div class="svc"><div class="svc-top"><button class="exp spacer">▶</button>
      <span class="s-ic" style="background:${SVC.other.color}">•</span><span class="s-name">All other sites</span>
      <span class="s-share">${Math.round(otherFrac * 100)}%</span><span class="s-total">${fmtMins(t.other)}</span></div>
      <div class="bar"><i style="width:${Math.round(otherFrac * 100)}%;background:${SVC.other.color};opacity:.8"></i></div></div>
    ${NEEDS_ADAPTER.map((n) => `<div class="svc"><div class="svc-top"><button class="exp spacer">▶</button>
      <span class="s-ic" style="background:var(--other);opacity:.6">•</span><span class="s-name">${esc(n.name)}</span>
      <span class="s-total">${fmtMins(t.other * n.minsShare)}</span></div>
      <div class="generic-note">${esc(n.note)}</div></div>`).join("")}` : "";
  return scope + real + adapter;
}

function trendsPane(orient) {
  const days = rangeDayList().filter((d) => d >= 1 && d <= 31);
  const scope = `<div class="tr-scope">Watched time per day · <b>${RANGES[state.range].label}</b> · ${esc(rangeResolved())}</div>`;
  const legend = `<div class="tr-legend">${SVC_ORDER.map((k) => `<span><i style="background:${SVC[k].color}"></i>${SVC[k].name}</span>`).join("")}</div>`;

  if (days.length <= 1) {
    const d = days[0];
    const t = d ? DAILY[d] || {} : {};
    return `<div class="tr-wrap">${scope}
      <div class="tr-hint">A single day has no trend to show. This is ${d ? "today" : "the selected day"}'s mix:</div>
      <div class="tr-rows" style="margin-top:10px">
        ${SVC_ORDER.filter((k) => (t[k] || 0) > 0).map((k) => `<div class="tr-row">
          <span class="rl">${SVC[k].name}</span>
          <span class="rt"><i style="width:100%;background:${SVC[k].color};opacity:.8"></i></span>
          <span class="rv">${fmtMins(t[k])}</span></div>`).join("") || '<div class="tr-hint">nothing watched yet</div>'}
      </div>${legend}</div>`;
  }

  const maxDay = Math.max(...days.map(dayTotal), 1);
  const isMonth = days.length > 12;

  if (orient === "horizontal") {
    const rows = days.map((d) => {
      const t = DAILY[d] || {}, tot = dayTotal(d);
      const rl = (WDL[d] || "Aug") + " " + d;
      const segs = SVC_ORDER.map((k) => (t[k] || 0) > 0
        ? `<i style="width:${(t[k] / maxDay * 100).toFixed(1)}%;background:${SVC[k].color};opacity:.85"></i>` : "").join("");
      return `<div class="tr-row ${tot === 0 ? "zero" : ""}"><span class="rl">${rl}</span>
        <span class="rt">${segs}</span><span class="rv">${tot ? fmtMins(tot) : "–"}</span></div>`;
    }).join("");
    return `<div class="tr-wrap">${scope}
      <div class="tr-ymax">bar length ∝ watch time · longest day = ${fmtMins(maxDay)}</div>
      <div class="tr-rows">${rows}</div>${legend}</div>`;
  }

  // vertical columns
  const H = 150;
  const cols = days.map((d) => {
    const t = DAILY[d] || {};
    const segs = SVC_ORDER.map((k) => (t[k] || 0) > 0
      ? `<span class="seg" style="height:${(t[k] / maxDay * H).toFixed(1)}px;background:${SVC[k].color};opacity:.85"></span>` : "").join("");
    return `<div class="tr-col">${dayIsProv(d) ? '<span class="cap"></span>' : ""}${segs}</div>`;
  }).join("");
  const xax = days.map((d, i) => {
    if (isMonth && i % 5 !== 0 && d !== NOW.d) return `<span></span>`;
    return `<span>${isMonth ? d : (WD[d] || "")}</span>`;
  }).join("");
  return `<div class="tr-wrap">${scope}
    <div class="tr-ymax">top of chart = ${fmtMins(maxDay)}</div>
    <div class="tr-cols ${isMonth ? "month" : ""}">${cols}</div>
    <div class="tr-xax ${isMonth ? "month" : ""}">${xax}</div>${legend}
    <div class="tr-hint">Hatched cap = day still open. ${isMonth ? "One column per day; labels every 5th." : "One column per day."}</div>
  </div>`;
}

  return `<div class="popover">
    <div class="top">${topId()}${rangeDropdown()}</div>
    ${serviceStrip()}
    ${tabRow(false)}
    <div class="body">${paneBody()}</div>
    <div class="foot"><span>range=${state.range} · pane=${state.pane}</span><span>380×560 · dropdown · gear settings</span></div>
    ${state.soOpen ? `<div class="slideover open"><div class="so-hd"><button data-so-close>‹</button> Settings</div><div class="body">${settingsPane()}</div></div>` : ""}
  </div>`;
}

function renderI() {
  return `<div class="popover">
    <div class="top">${topId()}${chips()}${weekStrip()}</div>
    ${serviceStrip()}
    ${tabRow(true)}
    <div class="body">${paneBody()}</div>
    <div class="foot"><span>range=${state.range} · pane=${state.pane}</span><span>380×560 · lands on Trends</span></div>
  </div>`;
}

/* ============================================================================
   RENDER + EVENTS
   ========================================================================== */
const RENDERERS = { G: renderG, H: renderH, I: renderI };
const NAMES = { G: "Week strip · 4 tabs · vertical Trends", H: "Range dropdown · gear · horizontal Trends", I: "Week strip · lands on Trends" };
const ORDER = ["G", "H", "I"];

function render() {
  document.body.className = "variant-" + state.variant;
  $("#stage").innerHTML = RENDERERS[state.variant]();
  const P = $("#stage .popover");
  $("#readout").textContent = `variant ${state.variant} · ${P ? P.offsetWidth : 0}×${P ? P.offsetHeight : 0} · range=${state.range} · total=${fmtMins(grandTotal())} · pane=${state.pane}`;
  $("#switcher").innerHTML = `<button data-cycle="-1">‹</button><span class="label"><b>${state.variant}</b><span>${NAMES[state.variant]}</span></span><button data-cycle="1">›</button>`;
}

function setVariant(v) {
  state.variant = v;
  state.pane = v === "I" ? "trends" : "history";
  state.soOpen = false; state.ddOpen = false;
  const u = new URL(location.href); u.searchParams.set("variant", v); history.replaceState(null, "", u);
  render();
}
function cycle(dir) { setVariant(ORDER[(ORDER.indexOf(state.variant) + dir + ORDER.length) % ORDER.length]); }

function pickRange(k) {
  state.range = k;
  if (k !== "custom") { state.customStart = state.customEnd = null; state.ddOpen = false; }
  render();
}
function applyCustom() {
  state.ddOpen = false; state.computing = true; render();
  setTimeout(() => { state.computing = false; render(); }, 420);
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-cycle],[data-range],[data-pane],[data-day-toggle],[data-svc-toggle],[data-cal],[data-dd-toggle],[data-so-open],[data-so-close],[data-toggle-login],[data-day]");
  if (!t) {
    if (state.ddOpen && !e.target.closest(".rng-dd")) { state.ddOpen = false; render(); }
    return;
  }
  if (t.dataset.cycle) return cycle(+t.dataset.cycle);
  if (t.dataset.range) return pickRange(t.dataset.range);
  if (t.dataset.pane) { state.pane = t.dataset.pane; state.soOpen = false; return render(); }
  if (t.dataset.dayToggle) { state.collapsed[t.dataset.dayToggle] = !state.collapsed[t.dataset.dayToggle]; return render(); }
  if (t.dataset.svcToggle !== undefined) { state.ytExpanded = !state.ytExpanded; return render(); }
  if (t.dataset.ddToggle !== undefined) { state.ddOpen = !state.ddOpen; return render(); }
  if (t.dataset.soOpen !== undefined) { state.soOpen = true; return render(); }
  if (t.dataset.soClose !== undefined) { state.soOpen = false; return render(); }
  if (t.dataset.toggleLogin !== undefined) { SETTINGS.launchAtLogin = !SETTINGS.launchAtLogin; return render(); }
  if (t.dataset.cal) {
    if (t.dataset.cal === "prev") { state.calMonth--; if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; } }
    if (t.dataset.cal === "next") { state.calMonth++; if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; } }
    if (t.dataset.cal === "apply") return applyCustom();
    return render();
  }
  if (t.dataset.day) {
    const d = new Date(state.calYear, state.calMonth, +t.dataset.day);
    if (!state.customStart || (state.customStart && state.customEnd)) { state.customStart = d; state.customEnd = null; }
    else if (d < state.customStart) { state.customEnd = state.customStart; state.customStart = d; }
    else { state.customEnd = d; }
    state.range = "custom";
    if (state.customStart && state.customEnd) return applyCustom();
    return render();
  }
});

document.addEventListener("keydown", (e) => {
  const ae = document.activeElement || document.body;
  if (["INPUT", "TEXTAREA"].includes(ae.tagName) || ae.isContentEditable) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});

const bootP = new URL(location.href).searchParams;
const boot = bootP.get("variant");
if (boot && ORDER.includes(boot.toUpperCase())) { state.variant = boot.toUpperCase(); state.pane = state.variant === "I" ? "trends" : "history"; }
const bootPane = bootP.get("pane");
if (["history", "services", "trends", "settings"].includes(bootPane)) state.pane = bootPane;
const bootRange = bootP.get("range");
if (["today", "week", "month"].includes(bootRange)) state.range = bootRange;
render();
</script>
</body>
</html>
