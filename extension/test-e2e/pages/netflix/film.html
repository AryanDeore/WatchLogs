<!--
  HAND-BUILT, not captured. A Netflix watch page cannot be saved the way the
  YouTube ones next door were: it needs a logged-in subscriber session, so
  there is no URL a capture script can reach. This reproduces the title block
  the player draws for a film: a heading holding the film's name, and nothing
  after it. No episode name is what makes this a film rather than a series.

  If the Netflix Adapter ever stops finding a title in the wild, suspect this
  file of having drifted from the real player before you suspect the Adapter.
-->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Glass Onion: A Knives Out Mystery | Netflix</title></head>
<body>
  <div class="watch-video">
    <video id="v" muted playsinline></video>
    <div class="watch-video--bottom-controls-container">
      <div class="video-title" data-uia="video-title">
        <h4>Glass Onion: A Knives Out Mystery</h4>
      </div>
    </div>
  </div>
</body>
</html>
