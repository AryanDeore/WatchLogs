<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WatchLogs pairing</title>
    <style>
      body { font: 13px -apple-system, system-ui, sans-serif; margin: 16px; width: 340px; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      p { color: #555; margin: 6px 0; }
      textarea { width: 100%; height: 88px; box-sizing: border-box; font-family: ui-monospace, monospace; }
      button { margin-top: 8px; padding: 5px 12px; }
      #result { margin-top: 10px; font-weight: 600; }
      .ok { color: #0a7a29; }
      .err { color: #b00020; }
    </style>
  </head>
  <body>
    <h1>Pair with the WatchLogs App</h1>
    <p>Open the WatchLogs menubar app, choose <em>Copy Pairing String</em>, and paste it here.</p>
    <textarea id="pairing" placeholder="base64 pairing string"></textarea>
    <button id="save">Pair</button>
    <div id="result"></div>
    <script type="module" src="options.js"></script>
  </body>
</html>
